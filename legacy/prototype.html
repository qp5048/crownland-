<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#eaf1f5">
<title>CrownLand.io — Claim your kingdom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2300c2e0'/%3E%3Cpath d='M14 44V22l10 9 8-14 8 14 10-9v22z' fill='%23ffd23f' stroke='%23a86b00' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#1f2f4d;--muted:#6c7f98;--cyan:#00c2e0;--deep:#0099b6;--gold:#f5b400;--gold-deep:#b97d00;--ember:#ff5a4f;--line:#dbe5ee;--good:#12a36b;--st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px)}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:'Segoe UI','Trebuchet MS',system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:#e6eef3}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;transition:transform .15s,background .15s,box-shadow .15s,border-color .15s;touch-action:manipulation}
@media(hover:hover){button:hover{transform:translateY(-2px)}}
button:active{transform:translateY(1px) scale(.98)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
input{-webkit-user-select:text;user-select:text;touch-action:manipulation}
#arena{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
.hidden{display:none!important}
li[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

header{position:absolute;top:calc(18px + var(--st));left:calc(22px + var(--sl));right:calc(22px + var(--sr));display:flex;align-items:center;justify-content:space-between;z-index:6;pointer-events:none}
.brand{display:flex;align-items:center;gap:8px;font-family:'Arial Black','Segoe UI',sans-serif;font-weight:900;font-size:20px;letter-spacing:-1px;color:var(--ink);text-decoration:none;pointer-events:auto}
.brand svg{width:28px;height:28px;flex:none}
.brand em{font-style:normal;color:var(--gold-deep);font-size:.8em}
.tools{display:flex;gap:10px;pointer-events:auto}
.icon-btn{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:#ffffffd9;border:1px solid #fff;box-shadow:0 5px 18px #35587912;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .off{display:none}.icon-btn.muted .on{display:none}.icon-btn.muted .off{display:inline}

.overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none;padding:calc(78px + var(--st)) 16px calc(58px + var(--sb))}
.menu-panel{pointer-events:auto;width:min(430px,100%);max-height:100%;overflow:auto;scrollbar-width:none;padding:24px 32px 22px;background:linear-gradient(150deg,#fffffff2,#ffffffb8);border:1.5px solid #fff;border-radius:32px;box-shadow:0 28px 70px #416d8c1f,inset 0 1px 0 #fff;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);text-align:center}
.menu-panel::-webkit-scrollbar{display:none}
.logo{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'Arial Black','Segoe UI',sans-serif;font-weight:900;font-size:50px;line-height:1;letter-spacing:-3px;color:var(--ink);transform:rotate(-2deg)}
.logo svg{width:58px;height:40px;margin-bottom:-2px;filter:drop-shadow(0 4px 0 #b97d0033)}
.logo small{font-size:.42em;letter-spacing:-1px;color:var(--gold-deep);margin-left:2px}
.logo .word{display:flex;align-items:baseline;text-shadow:0 4px 0 #1f2f4d10}
.tagline{font-size:17px;font-weight:600;margin:8px 0 0;color:var(--muted)}
#preview{display:block;width:150px;height:118px;margin:2px auto 4px}
.field{width:100%;height:50px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:0 16px;color:var(--ink);font-size:17px;outline:none;text-align:center;transition:border-color .2s}
.field:focus{border-color:var(--cyan)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mode-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:11px 12px 12px;text-align:left;background:#ffffffb3;border:1.5px solid var(--line);border-radius:16px}
.mode-card b{display:flex;align-items:center;gap:7px;font-size:16px}
.mode-card b svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mode-card small{font-size:12px;line-height:1.35;color:var(--muted)}
.mode-card .sv-icon{display:inline-grid;place-items:center;width:20px;height:20px}
.mode-card[aria-checked="true"]{border-color:var(--cyan);background:#e6fbff;box-shadow:0 0 0 3px #00c2e01f}
.mode-card[data-mode="survival"][aria-checked="true"]{border-color:var(--ember);background:#fff1ef;box-shadow:0 0 0 3px #ff5a4f1c}
.mode-card[data-mode="survival"] b{color:#d2382e}
.mode-card.locked{background:#f3f6f9;border-style:dashed}
.mode-card.locked b{color:#7d8ea4}
.mode-note{margin:9px 0 0;font-size:12px;font-weight:600;color:#c2412f}
.mode-note:empty{display:none}
.primary{position:relative;display:block;width:100%;height:62px;margin-top:14px;border-radius:19px;background:linear-gradient(160deg,#1bd6ec,#00b4d8);color:#fff;font-weight:900;font-size:24px;letter-spacing:.5px;box-shadow:0 7px 0 var(--deep),0 14px 24px #00aecd29,inset 0 2px 0 #ffffff66;overflow:hidden}
.primary:before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#ffffff45 48%,transparent 61%);transform:translateX(-120%);animation:shine 5s ease-in-out infinite}
.primary.danger{background:linear-gradient(160deg,#ff7a63,#f0463c);box-shadow:0 7px 0 #b92c24,0 14px 24px #f0463c2e,inset 0 2px 0 #ffffff55}
.customize{display:flex;gap:9px;margin-top:20px}
.customize button{position:relative;display:flex;gap:7px;align-items:center;justify-content:center;flex:1;height:46px;border:1px solid var(--line);border-radius:15px;background:#ffffffb8;font-weight:700;font-size:14px}
.customize svg{width:19px;height:19px;fill:none;stroke:#405574;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.customize .dot{position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:#ff4d6d;box-shadow:0 0 0 2px #fff}

footer{position:absolute;bottom:calc(18px + var(--sb));left:calc(22px + var(--sl));right:calc(22px + var(--sr));display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:13px;color:#5f7390;z-index:3}
.controls{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
footer button{font-size:13px;color:#5f7390;display:flex;align-items:center;gap:6px}
footer button span{display:inline-grid;place-items:center;border:1px solid #91a2b4;border-radius:50%;width:18px;height:18px}

.modal{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#29476140;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(16px + var(--st)) 16px calc(16px + var(--sb))}
.dialog{position:relative;width:min(480px,100%);max-height:100%;overflow:auto;padding:28px;background:linear-gradient(150deg,#fff,#f0f7fc);border:2px solid #fff;border-radius:28px;box-shadow:0 30px 100px #15345033;animation:appear .22s ease}
h2{font-size:26px;letter-spacing:-.6px;margin:0 30px 6px 0}
.close{position:absolute;right:16px;top:16px;border-radius:50%;width:32px;height:32px;font-size:24px;line-height:1;background:#e7eef4;color:#6c7f98}
.sub{font-size:14px;color:var(--muted);line-height:1.6;margin:0 0 18px}
.skin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.skin-option{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid #e4eaf2;border-radius:16px;padding:8px 2px 9px;background:#fff;font-size:11px;font-weight:600;color:#5b6d86}
.skin-option canvas{width:58px;height:58px}
.skin-option.locked canvas{opacity:.55;filter:saturate(.7)}
.skin-option.locked{background:#f7f9fb;color:#95a3b5}
.lock{position:absolute;top:6px;right:6px;width:16px;height:16px;fill:none;stroke:#8a9ab0;stroke-width:2.2;stroke-linecap:round}
.skin-option[aria-pressed="true"],.trail-option[aria-pressed="true"]{border-color:var(--cyan);background:#e8faff}
.trail-option{position:relative;display:flex;align-items:center;gap:15px;text-align:left;width:100%;background:#fff;border:2px solid #e4eaf2;border-radius:15px;padding:14px;margin-top:10px}
.trail-option.locked{background:#f7f9fb}.trail-option.locked .trail-swatch{opacity:.3}
.trail-swatch{flex:none;display:block;width:84px;height:10px;border-radius:8px;background:var(--cyan);box-shadow:inset 0 2px #ffffff60}
.trail-swatch.dashes{background:repeating-linear-gradient(90deg,var(--cyan) 0 11px,transparent 11px 16px);box-shadow:none}
.trail-swatch.sparkles{box-shadow:0 0 12px var(--cyan)}
.trail-swatch.rainbow{background:linear-gradient(90deg,#fa83ae,#ffcd68,#59dba7,#59cafa,#b098ff)}
.trail-option strong{font-size:14px}.trail-option small{display:block;color:#8b9aab;font-size:12px;margin-top:3px}
.req{margin:14px 0 0;font-size:13px;color:#b0452f;text-align:center;font-weight:600}
.req:empty{display:none}
.done{height:50px;font-size:18px;margin-top:20px}
.secondary{width:100%;padding:13px;margin-top:14px;border-radius:13px;background:#e6edf3;font-weight:700}
.help-row{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid #e5ecf2;font-size:14px;line-height:1.5}
.help-row svg{flex:none;width:30px;height:30px;fill:none;stroke:var(--cyan);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.help-row strong{display:block}.help-row span{color:#72849c}
.help-row.hot svg{stroke:var(--ember)}
.result-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:16px 0}
.result-stats div{background:#eaf1f7;text-align:center;padding:13px 4px;border-radius:13px}
.result-stats b{display:block;font-size:21px}
.result-stats span{font-size:11px;color:#72849c}
.shake{animation:shake .4s}

/* ranks */
.rank-block{display:flex;align-items:center;gap:16px;padding:14px;border-radius:20px;background:linear-gradient(135deg,#f8fbff,#eef4fa);border:1px solid #fff}
.medal-stage{position:relative;flex:none;width:124px;height:124px;display:grid;place-items:center}
.medal-stage canvas{position:relative;z-index:1}
.medal-stage:before{content:'';position:absolute;inset:4px;border-radius:50%;background:conic-gradient(#fff0 0 8%,#ffe08a 14%,#fff0 22% 45%,#9fe8ff 52%,#fff0 60% 80%,#ffc2e0 86%,#fff0 94%);opacity:0;filter:blur(2px)}
.rank-block.up .medal-stage:before{opacity:1;animation:spin 3.5s linear infinite}
.rank-block.up .medal-stage canvas{animation:medalPop 1s cubic-bezier(.3,1.6,.5,1) .25s both}
.rank-block.down .medal-stage canvas{animation:medalDrop .7s ease both}
.rank-info{flex:1;min-width:0}
.rank-info small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.rank-block.up .rank-info small{color:var(--good)}
.rank-block.down .rank-info small{color:#d2382e}
.rank-info b{display:block;font-size:22px;letter-spacing:-.5px;margin:2px 0}
.rp-delta{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.rp-delta.pos{color:var(--good)}.rp-delta.neg{color:#d2382e}
.rank-bar{height:8px;border-radius:5px;background:#e1e9f1;overflow:hidden;margin-top:12px}
.rank-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffc93c,#ff8f3c);border-radius:5px;transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.rank-bar-labels{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-top:5px}
.rp-lines{list-style:none;padding:0;margin:10px 0 0;font-size:13px}
.rp-lines li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #e1e8ef;color:#5d7089}
.rp-lines b.pos{color:var(--good)}.rp-lines b.neg{color:#d2382e}
.rewards{margin-top:14px;padding:12px 14px;border-radius:16px;background:#fff8e1}
.rewards h4{margin:0 0 6px;font-size:14px;color:var(--gold-deep)}
.reward{display:flex;align-items:center;gap:12px;padding:5px 0;animation:rise .5s ease both}
.reward b{display:block;font-size:14px}.reward span{font-size:12px;color:var(--muted)}
.banner{margin-top:12px;padding:12px 14px;border-radius:14px;background:#fff1ef;color:#b92c24;font-weight:700;font-size:14px}
.profile-head{display:flex;gap:16px;align-items:center;padding:14px;border-radius:20px;background:linear-gradient(135deg,#f8fbff,#eef4fa)}
.profile-head>div{flex:1;min-width:0}.profile-head>#pf-medal{flex:none}
.profile-head b{font-size:22px;display:block}
.profile-head span{font-size:13px;color:var(--muted)}
.section-title{font-size:15px;margin:20px 0 8px}
.ach-list{display:flex;flex-direction:column;gap:6px}
.ach{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;background:#fff;border:1px solid #e6edf3}
.ach>div{flex:1;min-width:0}.ach b{font-size:13px;display:block}.ach span{font-size:12px;color:var(--muted)}
.ach em{font-style:normal;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ach.done{background:#effcf6;border-color:#c8f0dc}.ach.done em{color:var(--good)}
.ach:not(.done) canvas,.ach:not(.done) .thumb-trail{opacity:.45}
.thumb-trail{display:grid;place-items:center;flex:none}
.history{list-style:none;margin:0;padding:0;font-size:12px}
.history li{display:grid;grid-template-columns:76px 1fr auto auto;gap:10px;padding:7px 0;border-bottom:1px solid #e8eef3;color:#5d7089}
.history .pos{color:var(--good);font-weight:700}.history .neg{color:#d2382e;font-weight:700}
.rank-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rank-cell{display:flex;flex-direction:column;align-items:center;padding:6px 2px 8px;border-radius:14px;font-size:10px;color:var(--muted);text-align:center}
.rank-cell b{font-size:11px;color:var(--ink)}
.rank-cell.current{background:#fff6d9;box-shadow:inset 0 0 0 2px #ffc93c}
.rank-cell.locked b{color:#9aa8b8}
.rank-cell{position:relative}.rank-cell.locked canvas{opacity:.55;filter:saturate(.75)}.rank-cell .lock{top:4px;right:6px}

/* HUD */
#hud{position:absolute;inset:0;z-index:3;pointer-events:none}
.score{position:absolute;top:calc(84px + var(--st));left:calc(22px + var(--sl));width:206px;padding:16px 20px;border-radius:22px;background:linear-gradient(145deg,#fffffff2,#ffffffbd);border:1px solid #fff;box-shadow:0 10px 30px #385f7c0f}
.score-top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#7a8ca3}
.badge{font-style:normal;font-size:10px;font-weight:800;padding:3px 8px;border-radius:9px;background:#e1f8fc;color:var(--deep);white-space:nowrap}
.badge.hot{background:#ffe7e4;color:#d2382e}
.score strong{display:block;font-size:40px;font-weight:800;letter-spacing:-2px;margin-top:2px}
.score strong small{font-size:20px;color:#8d9baf;margin-left:2px}
.score-track{height:6px;border-radius:4px;background:#e7eff5;overflow:hidden;margin:8px 0}
.score-track i{display:block;height:100%;width:0;min-width:3px;background:linear-gradient(90deg,var(--cyan),#8ae6ec);transition:width .3s}
.score-details{display:flex;justify-content:space-between;font-size:12px;color:#7a8ca4}
.leaderboard{position:absolute;right:calc(22px + var(--sr));top:calc(84px + var(--st));width:214px;padding:14px 16px;border-radius:22px;background:linear-gradient(145deg,#fffffff2,#ffffffbd);border:1px solid #fff;box-shadow:0 10px 30px #385f7c0f}
.leaderboard h3{margin:0 0 8px;font-size:12px;color:#7a8ca3}
.leaderboard ol{list-style:none;padding:0;margin:0}
.leaderboard li{display:flex;align-items:center;gap:7px;font-size:12px;padding:6px 0}
.leaderboard li.me{color:var(--deep);font-weight:800;background:#00bdd90f;border-radius:8px;margin:0 -7px;padding:6px 7px}
.leaderboard .rank{width:14px;font-size:11px;color:#91a0b1;text-align:center}
.leaderboard li:first-child .rank{color:var(--gold-deep);font-size:13px}
.leaderboard .dot{width:9px;height:9px;border-radius:3px;flex:none}
.leaderboard .name{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.leaderboard .lives{font-size:8px;letter-spacing:1px;color:#ff5d73}
.leaderboard .pct{font-size:11px;font-variant-numeric:tabular-nums}
#hud.tutorial .score,#hud.tutorial .leaderboard{display:none}
.game-hint{position:absolute;bottom:calc(26px + var(--sb));left:50%;transform:translateX(-50%);padding:9px 16px;border-radius:18px;background:#ffffffc4;border:1px solid #fff;color:#62768f;font-size:12px;white-space:nowrap;transition:opacity .6s}
.game-hint.fade{opacity:0}
#toast{position:absolute;left:50%;top:24%;transform:translate(-50%,10px);padding:10px 22px;border-radius:19px;background:#ffffffe0;border:1px solid #fff;box-shadow:0 10px 30px #14708014;font-size:19px;font-weight:800;color:var(--deep);opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-6px)}
#toast.gold{color:var(--gold-deep);background:#fff8e1f0}

/* tutorial coach */
.coach{position:absolute;top:calc(80px + var(--st));left:50%;width:min(460px,calc(100vw - 24px));margin-left:calc(min(460px,calc(100vw - 24px)) / -2);display:flex;gap:14px;align-items:center;padding:14px 14px 14px 14px;border-radius:22px;background:linear-gradient(145deg,#fffffff7,#ffffffd9);border:1px solid #fff;box-shadow:0 16px 44px #2a4a6a26;pointer-events:auto;z-index:4}
.coach.pop{animation:coachIn .5s cubic-bezier(.2,1.4,.4,1) both}
.coach-icon{flex:none;width:58px;height:58px;border-radius:17px;background:#e6fbff;display:grid;place-items:center;transition:background .3s}
.coach-icon svg{width:42px;height:42px;fill:none;stroke:var(--deep);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.coach.complete .coach-icon{background:#dff8ec}
.coach.complete .coach-icon svg{stroke:var(--good);animation:popIn .45s cubic-bezier(.3,1.7,.5,1) both}
.coach-body{flex:1;min-width:0}
.coach-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);font-weight:700}
.coach-dots{display:flex;gap:4px}.coach-dots i{width:7px;height:7px;border-radius:50%;background:#d5e1ea;transition:background .3s}
.coach-dots i.on{background:var(--cyan)}.coach-dots i.ok{background:#3ddc97}
.coach h4{margin:3px 0 2px;font-size:17px;letter-spacing:-.2px}
.coach p{margin:0;font-size:13px;line-height:1.45;color:#5d7089}
.coach-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;align-self:stretch;justify-content:space-between}
.coach-skip{font-size:12px;color:var(--muted);padding:4px 6px;border-radius:8px}
.coach-go{padding:10px 14px;border-radius:12px;background:var(--cyan);color:#fff;font-weight:800;font-size:14px;box-shadow:0 4px 0 var(--deep);white-space:nowrap}
.ic-move{animation:icMove 1.6s ease-in-out infinite}
.ic-drag{animation:icDrag 1.8s ease-in-out infinite}
.ic-draw{stroke-dasharray:60;animation:icDraw 1.8s ease-in-out infinite}
.ic-spin{transform-origin:24px 24px;animation:spin 2.4s linear infinite}
.ic-bob{animation:icBob 1.2s ease-in-out infinite}

.joystick{position:fixed;left:0;top:0;width:118px;height:118px;margin:-59px 0 0 -59px;border-radius:50%;background:radial-gradient(circle,#ffffff26 0 54%,#ffffff59 55% 100%);border:2px solid #ffffffd9;box-shadow:0 8px 26px #1f2f4d26,inset 0 0 0 1px #1f2f4d12;z-index:4;pointer-events:none;will-change:transform}
.joy-knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:linear-gradient(150deg,#fff,#dcf6fb);border:2px solid var(--cyan);box-shadow:0 6px 14px #1f2f4d33;will-change:transform}

/* menu intro — one orchestrated entrance */
body.intro .menu-panel{animation:panelIn .7s cubic-bezier(.2,1.25,.4,1) both}
body.intro .logo .word{animation:wordPop .7s cubic-bezier(.3,1.5,.5,1) .12s both}

  case 7:c.lineWidth=.72;chunks(2,(k,p)=>Math.floor(p.d*1.4)%2?'#ffffff':'#e8334a');break;
  case 8:c.lineWidth=.74;c.strokeStyle='#e8a800';c.stroke(path);c.lineWidth=.34;c.strokeStyle='#ffe27a';c.stroke(path);break;
  case 9:c.lineWidth=.8;c.strokeStyle='#3b1e7a';c.stroke(path);c.lineWidth=.3;c.strokeStyle='#8f6bff';c.stroke(path);break;

const Celebration={
 cv:null,x:null,parts:[],t:0,dur:0,tier:0,raf:0,W:0,H:0,cx:0,cy:0,

  if(!this.cv){this.cv=document.getElementById('fx');this.x=this.cv.getContext('2d')}

  this.tier=tier;this.cx=ox;this.cy=oy;this.t=0;this.dur=2.6+tier*.12;this.parts=[];this.cv.classList.remove('hidden');
  const M=METALS[RANKS[tier].metal],cols=[M.hi,M.mid,M.lo,M.rib[0],'#ffffff'];
  const n=eco?30:40+tier*14;
  for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*2.4,v=380+Math.random()*520;this.parts.push({type:'conf',x:ox,y:oy,vx:Math.cos(a)*v*.8,vy:Math.sin(a)*v,rot:Math.random()*6,vr:(Math.random()-.5)*14,w:5+Math.random()*6,h:3+Math.random()*4,col:cols[i%cols.length]})}
  if(tier>=3)for(let i=0;i<(eco?8:10+tier*2);i++)this.parts.push({type:'star',x:ox+(Math.random()-.5)*240,y:oy+(Math.random()-.5)*160,s:6+Math.random()*10,ph:Math.random()*6});
  if(tier>=9&&!eco)for(let i=0;i<Math.min(6,tier-7);i++)this.parts.push({type:'rocket',x:W*(.15+Math.random()*.7),y:H+10,vy:-(620+Math.random()*260),at:.2+i*.35,col:cols[i%3]});
  if(tier>=12&&!eco)for(let i=0;i<26;i++)this.parts.push({type:'shard',x:Math.random()*W,y:-20-Math.random()*H*.6,vy:180+Math.random()*220,rot:Math.random()*6,vr:(Math.random()-.5)*4,s:5+Math.random()*7});
  if(tier>=14&&!eco)this.parts.push({type:'crown'});
  cancelAnimationFrame(this.raf);let last=performance.now();
  const step=now=>{const dt=Math.min(.05,(now-last)/1000);last=now;this.t+=dt;this.frame(dt);if(this.t<this.dur)this.raf=requestAnimationFrame(step);else{this.x.clearRect(0,0,W,H);this.cv.classList.add('hidden')}};
  this.raf=requestAnimationFrame(step);
 },
 frame(dt){
  const c=this.x,W=this.W,H=this.H,t=this.t,fade=Math.max(0,Math.min(1,(this.dur-t)/.6)),M=METALS[RANKS[this.tier].metal];c.clearRect(0,0,W,H);
  if(this.tier>=6){const a=Math.min(1,t*3)*fade*(.25+this.tier*.02),rays=12+this.tier;c.save();c.translate(this.cx,this.cy);c.rotate(t*.4);c.globalAlpha=a;for(let i=0;i<rays;i++){c.rotate(TAU/rays);c.beginPath();c.moveTo(0,0);c.lineTo(-30,-Math.max(W,H));c.lineTo(30,-Math.max(W,H));c.closePath();c.fillStyle=i%2?alphaHex(M.hi,.5):alphaHex(M.mid,.35);c.fill()}c.restore();c.globalAlpha=1}
  if(this.tier>=14&&t<.35){c.fillStyle=`rgba(255,240,190,${(.35-t)*1.6})`;c.fillRect(0,0,W,H)}
  const add=[];
  for(const p of this.parts){
   if(p.type==='conf'){p.vy+=900*dt;p.vx*=.985;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;c.save();c.globalAlpha=fade;c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.col;c.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.rot*1.7)));c.restore()}
   else if(p.type==='star'){const tw=Math.max(0,Math.sin(t*5+p.ph));c.globalAlpha=tw*fade;c.fillStyle='#fff';starPath(c,p.x,p.y,Math.max(.1,p.s*tw),.25);c.fill();c.globalAlpha=1}
   else if(p.type==='rocket'){if(t<p.at)continue;if(!p.boom){p.y+=p.vy*dt;p.vy+=420*dt;c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,3,0,TAU);c.fill();if(p.vy>-60){p.boom=true;for(let i=0;i<36;i++){const a=i/36*TAU,v=160+Math.random()*120;add.push({type:'spark',x:p.x,y:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,col:i%2?p.col:'#ffffff',l:1})}}}}
   else if(p.type==='spark'){p.vy+=160*dt;p.vx*=.97;p.vy*=.97;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt*.9;if(p.l>0){c.globalAlpha=p.l*fade;c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,2.2,0,TAU);c.fill();c.globalAlpha=1}}
   else if(p.type==='shard'){p.y+=p.vy*dt;p.rot+=p.vr*dt;c.save();c.globalAlpha=.85*fade;c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.s>8?'#ffffff':'#aeeaff';c.beginPath();c.moveTo(0,-p.s);c.lineTo(p.s*.6,0);c.lineTo(0,p.s);c.lineTo(-p.s*.6,0);c.closePath();c.fill();c.restore()}
   else if(p.type==='crown'){const k=Math.min(1,t/.9),e=1-Math.pow(1-k,3),y=-120+(this.cy-150+120)*e;c.save();c.globalAlpha=fade;c.translate(this.cx,y);c.rotate(Math.sin(t*3)*.06);paintCrown(c,110,'gold');c.restore()}
  }

  {id:'steer',icon:()=>coarse?'touch':'mouse',title:'Steer your cube',text:()=>coarse?'Touch and drag anywhere. A joystick appears under your finger.':'Move the mouse and your cube turns toward the pointer. WASD and arrows work too.'},
  {id:'leave',icon:()=>'trail',title:'Leave your land',text:()=>'Head out of your colored area. You draw a trail as you go.'},

 ],
 begin(){this.active=true;this.step=0;this.acc=0;this.wait=0;this.readyT=0;this.dummy=null;this.captured=false;this.lastA=game.actors[0].angle;$('#hud').classList.add('tutorial');$('#coach').classList.remove('hidden');this.render()},

  $('#coach-dots').innerHTML=this.STEPS.map((s,i)=>`<i class="${i<this.step?'ok':i===this.step?'on':''}"></i>`).join('');$('#coach-title').textContent=st.title;$('#coach-text').textContent=st.text();

/* ---------- lifecycle ---------- */
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){if(game&&game.mode==='playing')pause();if(Sound.ctx&&Sound.ctx.state==='running')Sound.ctx.suspend().catch(()=>{})}
 else{last=0;if(Sound.ctx&&Sound.ctx.state==='suspended')Sound.ctx.resume().then(audioLockUI).catch(()=>{})}
});
addEventListener('pagehide',save);

/* ---------- loop: clamped delta, fixed-step sim, adaptive resolution, eco frame cap ---------- */
let hudClock=0,perfAvg=1/60,perfClock=0,lockClock=0;
const SHOWCASE=[{skin:itemFor('skin','royal'),acc:'halo'},{skin:itemFor('skin','kitty'),acc:'bow'},{skin:itemFor('skin','galaxy'),acc:'wizard'},{skin:itemFor('skin','emperor'),acc:'wings'}];
function update(dt){
 time+=dt;if(!game)menuIntro+=dt;aimMouse();Tutorial.update(dt);if(game)game.update(dt);
 if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('#toast').classList.remove('show')}
 if(hintTimer>0){hintTimer-=dt;if(hintTimer<=0)$('#game-hint').classList.add('fade')}
}
const HEAD_ACCS=new Set(['party','halo','horns','tophat','wizard','viking','cowboy','catears','antenna','headphones','bow']);
function drawPreview(){
 const w=preview.clientWidth,h=preview.clientHeight;if(!w||!h)return;const k=preview.width/w,eco=prefs.set.eco;
 pctx.setTransform(1,0,0,1,0,0);pctx.clearRect(0,0,preview.width,preview.height);pctx.setTransform(k,0,0,k,0,0);
 const skin=currentSkin(),acc=currentAcc(),tall=acc==='wizard'||acc==='antenna',head=skin.crown||HEAD_ACCS.has(acc),s=Math.min(w,h)*(tall?.38:head?.44:.52),wob=renderer.reduce||eco?0:Math.sin(time*1.4)*.35;
 renderer.drawCube(pctx,skin,w/2,h*(tall?.7:head?.64:.53),s,-Math.PI/2+wob,0,eco?0:time,0,skin.crown,k,2.2,acc);
}
let shopIconDrawn=false;
function drawShopIcon(){
 if(prefs.set.eco&&shopIconDrawn)return;shopIconDrawn=true;const k=shopIcon.width/38;
 sictx.setTransform(1,0,0,1,0,0);sictx.clearRect(0,0,shopIcon.width,shopIcon.height);sictx.setTransform(k,0,0,k,0,0);
 const t=prefs.set.eco?0:time;renderer.drawCube(sictx,MAGIC_DEF,19,23,17,-Math.PI/2+Math.sin(t*2)*.25,0,t,0,null,k,1.6,null);
}
function draw(dt){
 if(game){renderer.draw(game,W,H,dt,currentSkin(),currentAcc(),trailKind(),time);view=renderer.view}
 else{renderer.menu(W,H,time,menuIntro,SHOWCASE);if(!$('#menu').classList.contains('hidden')){drawPreview();drawShopIcon()}}
}
function adapt(dt){if(!game||game.mode!=='playing'||manual||prefs.set.eco)return;perfAvg+=(dt-perfAvg)*.05;perfClock+=dt;if(perfClock<3)return;perfClock=0;if(perfAvg>1/42&&dprCap>1){dprCap=Math.max(1,dprCap-.5);resize()}}
function frame(t){
 requestAnimationFrame(frame);
 // Ultra economy: draw at most 60, 40 or 30 frames per second.
 if(prefs.set.eco&&last&&t-last<1000/prefs.set.fps-1.5)return;
 let dt=last?(t-last)/1000:1/60;last=t;if(!(dt>0))dt=1/60;if(dt>.1)dt=.1;
 if(!manual)update(dt);draw(dt);hudClock+=dt;if(hudClock>.2){updateHud();hudClock=0}adapt(dt);
 lockClock+=dt;if(lockClock>1){lockClock=0;audioLockUI()}
}

/* ---------- test hooks ---------- */
window.render_game_to_text=()=>JSON.stringify(game?{...game.state(),skin:currentSkin().name,trail:prefs.trail,acc:prefs.acc,coins:prefs.coins,boost:game.boost,revives:game.revives,pending:game.pending.length,tutorialStep:Tutorial.active?Tutorial.STEPS[Tutorial.step].id:null}:{mode:'menu',gameMode:prefs.mode,rp:prefs.rp,rank:RANKS[rankIndex(prefs.rp)].name,classicGames:prefs.classicGames,coins:prefs.coins,skin:currentSkin().name});
window.advanceTime=ms=>{manual=true;for(let n=0;n<Math.ceil(ms/(1000/60));n++)update(1/60);draw(1/60);updateHud()};

/* ---------- boot ---------- */
$('#controls-label').textContent=coarse?'Touch and drag to steer':'Mouse, WASD or arrow keys · Space: boost';
applyEco();refreshMenu();Sound.unlock();Music.play('menu');playIntro();Poki.load();audioLockUI();requestAnimationFrame(frame);
function maybeDaily(){if(prefs.tutorialDone&&dailyState()&&!popups.includes(showDaily))queuePopup(showDaily)}
if(penaltyNotice)popups.push(()=>showModal('Ranked match abandoned',`<p class="sub">You closed the game during a ranked Survival match, so it counted as leaving.</p><div class="coins-line" style="background:#fff1ef;color:#d2382e"><span>Leaving penalty</span><span>−${QUIT_PENALTY} RP</span></div><p class="sub" style="margin-top:14px">You are now ${RANKS[rankIndex(prefs.rp)].name} with ${prefs.rp} RP. Finish ranked matches to avoid this.</p><button class="primary done" id="ok-pen">Got it</button>`,false)||$('#ok-pen').addEventListener('click',()=>{Sound.play('click');hideModal()}));
setTimeout(()=>{maybeDaily();nextPopup()},1600);
{const h=home;home=function(){h();maybeDaily()}}
</script>
</body>
</html>
