<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3fb2ff">
<title>Chop Hop</title>
<meta name="description" content="Flip, slice and hop your blade through juicy worlds. Stick the landing, fill the Fever meter, beat the bosses and hit the bullseye!">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2329b6ff'/%3E%3Cpath d='M14 46 L44 12 Q52 8 50 18 L22 52 Z' fill='%23eef4fa' stroke='%231d3557' stroke-width='3'/%3E%3Crect x='8' y='44' width='16' height='8' rx='3' transform='rotate(-48 16 48)' fill='%23ff3b5c' stroke='%231d3557' stroke-width='3'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#1d2b4f;--muted:#6b7b99;--white:#fff;--panel:#ffffff;--line:#e5ecf5;
  --green:#2fd36b;--green-d:#1a9e4c;--purple:#a14dff;--purple-d:#6d23c9;--blue:#2fa8ff;--blue-d:#1673c9;
  --yellow:#ffc928;--yellow-d:#d88f00;--red:#ff4d6d;--red-d:#c4223f;--pink:#ff5fa2;
  --st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);
  --font:'Trebuchet MS','Arial Rounded MT Bold','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:#3fb2ff}
body{font-family:var(--font);font-weight:800;color:var(--ink)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hidden{display:none!important}
svg.i{width:1em;height:1em;flex:none;vertical-align:middle}

/* --- outlined game text --- */
.otext{color:#fff;paint-order:stroke fill;-webkit-text-stroke:6px var(--ink);text-shadow:0 5px 0 var(--ink)}

#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
#ui > *{pointer-events:none}
#ui button, #ui .modal, #ui .pill, #ui .menu-btn{pointer-events:auto}

/* --- top bar --- */
#topbar{position:absolute;top:calc(12px + var(--st));left:calc(12px + var(--sl));right:calc(12px + var(--sr));display:flex;align-items:flex-start;gap:8px}
.pill{display:flex;align-items:center;gap:6px;height:38px;padding:0 14px 0 6px;border-radius:20px;background:rgba(29,43,79,.55);color:#fff;font-size:18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.pill svg.i{width:28px;height:28px}
.pill.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.18)}}
#topbar .spacer{flex:1}
.round{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:#fff;box-shadow:0 4px 0 #c9d6e6,0 6px 14px rgba(0,0,0,.15);color:var(--ink);transition:transform .1s}
.round svg.i{width:24px;height:24px}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 #c9d6e6}

/* --- HUD --- */
#hud{position:absolute;top:calc(14px + var(--st));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:min(420px,58vw)}
.progress{display:flex;align-items:center;gap:6px;width:100%}
.lvlc{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:#fff;background:var(--blue);box-shadow:0 3px 0 var(--blue-d);flex:none}
.lvlc.next{background:#fff;color:var(--ink);box-shadow:0 3px 0 #c9d6e6}
.bar{position:relative;flex:1;height:14px;border-radius:8px;background:rgba(29,43,79,.35);overflow:visible}
.bar > i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px;background:linear-gradient(#7cf0a5,#2fd36b);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.bar .smark{position:absolute;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);color:rgba(255,255,255,.55);filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.bar .smark.got{color:var(--yellow)}
.bar .smark svg{width:100%;height:100%}
#lvlCoins{display:flex;align-items:center;gap:6px;font-size:38px;line-height:1}
#lvlCoins svg.i{width:34px;height:34px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
#lvlCoins.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.15)}}
#fever{position:relative;width:min(220px,40vw);height:16px;border-radius:9px;background:rgba(29,43,79,.35);overflow:hidden;opacity:.95}
#fever i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,#ffd23f,#ff7a1a,#ff2f6d);border-radius:9px}
#fever span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#fff;letter-spacing:2px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
#fever.on{animation:feverGlow .4s infinite alternate}
@keyframes feverGlow{to{box-shadow:0 0 18px #ff7a1a}}
#bossbar{display:flex;align-items:center;gap:8px;width:100%}
#bossbar .bar{height:18px;background:rgba(29,43,79,.45)}
#bossbar .bar > i{background:linear-gradient(#ff8fa3,#ff2f55);transition:width .15s}
#bossbar .skull{font-size:22px}
#vignette{position:absolute;inset:0;opacity:0;transition:opacity .3s;background:radial-gradient(ellipse at center,rgba(255,120,0,0) 55%,rgba(255,90,0,.42) 100%)}
#vignette.on{opacity:1;animation:vig .5s infinite alternate}
@keyframes vig{to{opacity:.6}}

/* --- floating texts --- */
#floats{position:absolute;inset:0;overflow:hidden}
.ft{position:absolute;left:0;top:0;will-change:transform}
.ft span{display:block;transform:translate(-50%,-50%);font-size:24px;white-space:nowrap;color:#fff;paint-order:stroke fill;-webkit-text-stroke:5px var(--ink);animation:ftUp .95s ease-out forwards}
.ft.gold span{color:#ffd23f}
.ft.big span{font-size:36px}
.ft.perfect span{color:#7cf0ff;font-size:30px}
.ft.fever span{color:#ffb03a}
.ft.star span{color:#ffe066;font-size:30px}
.ft.combo span{color:#ff8ad8;font-size:30px}
@keyframes ftUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}30%{transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-190%) scale(.95)}}

/* --- banner --- */
#banner{position:absolute;top:32%;left:0;right:0;text-align:center;font-size:clamp(34px,7vw,64px);opacity:0}
#banner.show{animation:banner 1.5s ease-out forwards}
@keyframes banner{0%{opacity:0;transform:scale(2.2) rotate(-6deg)}12%{opacity:1;transform:scale(.95) rotate(-3deg)}20%{transform:scale(1.05) rotate(-3deg)}80%{opacity:1;transform:scale(1) rotate(-3deg)}100%{opacity:0;transform:scale(.9) translateY(-30px) rotate(-3deg)}}

/* --- hint --- */
#hint{position:absolute;left:50%;bottom:calc(18% + var(--sb));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:22px;background:rgba(29,43,79,.7);color:#fff;font-size:clamp(16px,2.6vw,22px);white-space:nowrap;opacity:0;transition:opacity .3s}
#hint.show{opacity:1}
#hint .hand{width:30px;height:30px;animation:tapHand .8s infinite}
@keyframes tapHand{50%{transform:translateY(5px) scale(.9)}}

/* --- menu --- */
#menu{position:absolute;inset:0}
#logo{position:absolute;top:calc(13% + var(--st));left:0;right:0;text-align:center;line-height:.82;transform:rotate(-4deg)}
#logo .l1,#logo .l2{display:block;font-size:clamp(56px,12vw,108px);letter-spacing:2px;font-family:'Arial Black',var(--font);font-weight:900}
#logo .l1{color:#fff;paint-order:stroke fill;-webkit-text-stroke:10px var(--ink);text-shadow:0 8px 0 var(--ink)}
#logo .l2{color:var(--yellow);paint-order:stroke fill;-webkit-text-stroke:10px var(--ink);text-shadow:0 8px 0 var(--ink);margin-left:12%}
#logo .blade{position:absolute;left:50%;top:-4%;width:clamp(64px,11vw,110px);transform:translateX(-255%) rotate(-24deg);animation:logoBlade 2.4s ease-in-out infinite}
@keyframes logoBlade{50%{transform:translateX(-255%) rotate(-8deg) translateY(-8px)}}
#lvlLabel{position:absolute;top:calc(13% + var(--st) + clamp(130px,25vw,215px));left:0;right:0;text-align:center;font-size:clamp(20px,3.4vw,28px)}
#lvlLabel small{display:block;font-size:.65em;opacity:.95;margin-top:4px}
#tapPlay{position:absolute;bottom:calc(20% + var(--sb));left:0;right:0;text-align:center;font-size:clamp(26px,4.6vw,40px);animation:breathe 1.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08)}}
.menu-side{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px}
.menu-side.left{left:calc(14px + var(--sl))}
.menu-side.right{right:calc(14px + var(--sr))}
.menu-btn{position:relative;width:78px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.menu-btn .ic{width:66px;height:66px;border-radius:22px;display:grid;place-items:center;background:#fff;box-shadow:0 5px 0 #c9d6e6,0 8px 16px rgba(0,0,0,.18);transition:transform .1s}
.menu-btn .ic svg{width:40px;height:40px}
.menu-btn:active .ic{transform:translateY(4px);box-shadow:0 1px 0 #c9d6e6}
.menu-btn .ic img{width:58px;height:58px}
.badge{position:absolute;top:-6px;right:-4px;padding:3px 7px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;box-shadow:0 2px 0 var(--red-d);animation:breathe 1s infinite}
#skinProg{position:absolute;bottom:calc(8% + var(--sb));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:24px;background:rgba(29,43,79,.55);color:#fff;font-size:15px}
#skinProg .mini{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;overflow:hidden}
#skinProg .mini img{width:36px;filter:brightness(0) invert(1) opacity(.85)}
#skinProg .sbar{width:130px;height:12px;border-radius:7px;background:rgba(255,255,255,.25);overflow:hidden}
#skinProg .sbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff8a3d);border-radius:7px;transition:width .6s}

/* --- modals --- */
.modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(18,24,48,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:calc(16px + var(--st)) 16px calc(16px + var(--sb));animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.panel{position:relative;width:min(420px,100%);max-height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding:44px 20px 20px;border-radius:28px;background:var(--panel);box-shadow:0 8px 0 #c9d6e6,0 20px 50px rgba(0,0,0,.3);animation:panelIn .35s cubic-bezier(.2,1.4,.4,1)}
.panel.wide{width:min(560px,100%)}
.panel.shop{height:min(640px,calc(100vh - 40px - var(--st) - var(--sb)))}
@keyframes panelIn{from{transform:scale(.6);opacity:0}}
.ribbon{position:absolute;top:-22px;left:50%;transform:translateX(-50%);min-width:70%;padding:10px 26px;border-radius:16px;background:linear-gradient(#ff6b86,var(--red));color:#fff;text-align:center;font-size:clamp(18px,4vw,24px);white-space:nowrap;box-shadow:0 5px 0 var(--red-d);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.ribbon.blue{background:linear-gradient(#5cc0ff,var(--blue));box-shadow:0 5px 0 var(--blue-d)}
.ribbon.green{background:linear-gradient(#5ce68f,var(--green));box-shadow:0 5px 0 var(--green-d)}
.ribbon.purple{background:linear-gradient(#c084ff,var(--purple));box-shadow:0 5px 0 var(--purple-d)}
.close{position:absolute;top:-14px;right:-10px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-d)}
.close svg{width:20px;height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:180px;height:56px;padding:0 22px;border-radius:18px;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .1s,box-shadow .1s}
.btn svg.i{width:26px;height:26px}
.btn.green{background:linear-gradient(#5ce68f,var(--green));box-shadow:0 6px 0 var(--green-d)}
.btn.purple{background:linear-gradient(#c084ff,var(--purple));box-shadow:0 6px 0 var(--purple-d)}
.btn.blue{background:linear-gradient(#5cc0ff,var(--blue));box-shadow:0 6px 0 var(--blue-d)}
.btn.yellow{background:linear-gradient(#ffdb5c,var(--yellow));box-shadow:0 6px 0 var(--yellow-d);color:var(--ink);text-shadow:none}
.btn.small{height:44px;min-width:0;font-size:16px;border-radius:14px}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn[disabled]{filter:grayscale(.8);opacity:.6;pointer-events:none}
.link{color:var(--muted);font-size:16px;padding:8px 14px;text-decoration:underline;text-underline-offset:3px}
.fadein{animation:fadeIn .4s}

/* fail */
.timer{position:relative;width:120px;height:120px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:10}
.timer .bg{stroke:#eef2f8}
.timer .fg{stroke:var(--purple);stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.timer .heart{position:absolute;inset:0;display:grid;place-items:center;color:var(--red)}
.timer .heart svg{width:52px;height:52px;transform:none;animation:breathe .8s infinite}
.big-q{font-size:26px}

/* complete */
.stars3{display:flex;gap:6px;margin-top:6px}
.stars3 .s{width:58px;height:58px;color:#e2e8f2;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
.stars3 .s:nth-child(2){transform:translateY(-12px);width:70px;height:70px}
.stars3 .s.got{color:var(--yellow);animation:starIn .5s cubic-bezier(.2,1.6,.4,1) both}
.stars3 .s svg{width:100%;height:100%}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
.rows{width:100%;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-radius:14px;background:#f2f6fb;font-size:18px}
.row b{display:flex;align-items:center;gap:6px;font-size:22px}
.row b svg.i{width:24px;height:24px}
.row.mult b{color:var(--green-d)}
.row.result{background:linear-gradient(#fff6d6,#ffeaa3);font-size:20px}
.row.result b{font-size:32px;color:#b86e00}
.best{color:var(--muted);font-size:14px}
.newblade{width:100%;display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:14px;background:#f2f6fb}
.newblade .mini{width:46px;height:46px;border-radius:12px;background:#dfe7f2;display:grid;place-items:center;overflow:hidden}
.newblade .mini img{width:42px;filter:brightness(0) opacity(.35)}
.newblade .txt{flex:1;font-size:14px;color:var(--muted)}
.newblade .sbar{height:12px;border-radius:7px;background:#dfe7f2;overflow:hidden;margin-top:4px}
.newblade .sbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff8a3d);transition:width .8s}
.newblade .pct{font-size:18px;color:var(--ink)}
.btns{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:4px}

/* shop */
.tabs{display:flex;gap:6px;padding:5px;border-radius:16px;background:#eef2f8;width:100%}
.tabs button{flex:1;height:40px;border-radius:12px;font-size:16px;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 3px 0 #d5dfec}
.scroll{width:100%;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:4px 4px 8px;flex:1;min-height:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 8px;border-radius:18px;background:#f2f6fb;box-shadow:0 4px 0 #dbe4f0;font-size:12px;color:var(--ink);transition:transform .1s}
.card:active{transform:translateY(3px)}
.card img{width:74%;aspect-ratio:1}
.card .nm{font-size:12px;line-height:1.1;text-align:center;min-height:2.2em;display:flex;align-items:center}
.card .st{display:flex;align-items:center;gap:3px;font-size:13px;padding:3px 8px;border-radius:10px;background:#fff}
.card .st svg.i{width:16px;height:16px}
.card.locked img{filter:brightness(0) opacity(.25)}
.card.sel{background:#e7fbe9;box-shadow:0 4px 0 #a8e6b6,0 0 0 3px var(--green) inset}
.card.sel .st{background:var(--green);color:#fff}
.card.afford .st{background:var(--yellow)}
.up{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:18px;background:#f2f6fb;box-shadow:0 4px 0 #dbe4f0;margin-bottom:10px}
.up .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;flex:none}
.up .ic svg{width:30px;height:30px}
.up .info{flex:1;min-width:0}
.up .info .t{font-size:17px}
.up .info .d{font-size:12px;color:var(--muted);font-weight:700}
.up .pips{display:flex;gap:3px;margin-top:5px}
.up .pips i{flex:1;max-width:14px;height:7px;border-radius:4px;background:#d9e2ee}
.up .pips i.on{background:var(--green)}
.up .btn{min-width:96px;height:46px;font-size:16px;padding:0 10px}
.shopfoot{display:flex;gap:10px;width:100%;justify-content:center}

/* wheel */
#wheelWrap{position:relative;width:min(300px,72vw,calc(100vh - 230px));aspect-ratio:1}
#wheelCanvas{width:100%;height:100%;border-radius:50%;box-shadow:0 8px 0 #c9d6e6,0 0 0 8px #fff,0 0 0 12px var(--ink)}
#wheelPtr{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:40px;height:48px;color:var(--red);filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
#wheelPtr svg{width:100%;height:100%}
#wheelHub{position:absolute;inset:38%;border-radius:50%;background:#fff;box-shadow:0 0 0 5px var(--ink);display:grid;place-items:center;font-size:12px;color:var(--ink)}
#wheelInfo{font-size:14px;color:var(--muted);min-height:20px}

/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 4px;border-bottom:2px solid #f0f4f9;font-size:18px}
.set-row:last-of-type{border-bottom:0}
.toggle{position:relative;width:62px;height:34px;border-radius:18px;background:#d9e2ee;transition:background .2s;flex:none}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.toggle.on{background:var(--green)}
.toggle.on::after{left:31px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:#eef2f8}
.seg button{padding:7px 10px;border-radius:10px;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 #d5dfec}
.danger{color:var(--red);font-size:14px;padding:8px}

/* unlock */
.rays{position:relative;width:200px;height:200px;display:grid;place-items:center}
.rays::before{content:'';position:absolute;inset:-30px;background:repeating-conic-gradient(rgba(255,201,40,.35) 0 12deg,transparent 12deg 30deg);border-radius:50%;animation:spin 8s linear infinite;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
.rays img{position:relative;width:170px;animation:floaty 2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{50%{transform:translateY(-8px) rotate(4deg)}}
.uname{font-size:28px}

/* toast & loading & ad */
#toast{position:absolute;left:50%;bottom:calc(24px + var(--sb));transform:translate(-50%,20px);padding:12px 20px;border-radius:16px;background:rgba(29,43,79,.88);color:#fff;font-size:16px;opacity:0;transition:all .25s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#loading{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:linear-gradient(#3fb2ff,#9fe0ff);transition:opacity .4s}
#loading .lt{display:flex;flex-direction:column;align-items:center;gap:18px;color:#fff;font-size:22px}
#loading .spin{width:64px;height:64px;border-radius:50%;border:8px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
#adCover{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:rgba(0,0,0,.82);color:#fff;font-size:20px}
#adCover .spin{width:48px;height:48px;border-radius:50%;border:6px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .8s linear infinite;margin:0 auto 12px}

@media (max-height:640px){
  .panel{gap:8px;padding:38px 16px 14px}
  .stars3 .s{width:40px;height:40px}.stars3 .s:nth-child(2){width:48px;height:48px}
  .row{padding:6px 12px;font-size:15px}.row b{font-size:18px}.row.result b{font-size:24px}
  .btn{height:46px;font-size:17px}
  #logo{top:calc(6% + var(--st))}
  #lvlLabel{top:calc(6% + var(--st) + clamp(110px,22vw,200px))}
  .menu-btn .ic{width:54px;height:54px}
  .menu-btn .ic svg{width:32px;height:32px}
  #skinProg{bottom:calc(4% + var(--sb))}
  #tapPlay{bottom:calc(22% + var(--sb))}
  .newblade{display:none}
  .ribbon{top:-18px;padding:7px 22px}
  .rows{gap:4px}
  .best{display:none}
  .btns{gap:8px}
  .timer{width:90px;height:90px}
  .rays{width:130px;height:130px}.rays img{width:120px}
}
@media (max-width:520px){
  #hud{width:62vw;top:calc(64px + var(--st))}
  .menu-side{top:58%}
  .menu-btn{width:66px;font-size:11px}
  .menu-btn .ic{width:56px;height:56px;border-radius:18px}
  #lvlCoins{font-size:30px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-coin" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#ffc928" stroke="#1d2b4f" stroke-width="2.5"/><circle cx="16" cy="16" r="9" fill="none" stroke="#e8a000" stroke-width="2.5"/><path d="M13 11h5a3 3 0 0 1 0 6h-4m0 0h5a3 3 0 0 1 0 6h-6" fill="none" stroke="#b86e00" stroke-width="0"/><path d="M12 9.5l3-2 2 2-3 13-2.5-1z" fill="#fff" opacity=".55"/></symbol>
    <symbol id="i-star" viewBox="0 0 32 32"><path d="M16 2.5l4.1 8.6 9.4 1.2-6.9 6.5 1.8 9.3L16 23.5l-8.4 4.6 1.8-9.3-6.9-6.5 9.4-1.2z" fill="currentColor" stroke="#1d2b4f" stroke-width="2.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-star-plain" viewBox="0 0 32 32"><path d="M16 2.5l4.1 8.6 9.4 1.2-6.9 6.5 1.8 9.3L16 23.5l-8.4 4.6 1.8-9.3-6.9-6.5 9.4-1.2z" fill="currentColor"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5.5" y="4" width="4.5" height="16" rx="1.5" fill="currentColor"/><rect x="14" y="4" width="4.5" height="16" rx="1.5" fill="currentColor"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z" fill="currentColor"/></symbol>
    <symbol id="i-ad" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="4" fill="#fff"/><path d="M10 8.5v7l6-3.5z" fill="#a14dff"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><path d="M4 3.5V8h4.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11.5L12 4l8.5 7.5M6 10v9.5h4.5V15h3v4.5H18V10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></symbol>
    <symbol id="i-blade" viewBox="0 0 48 48"><path d="M8 40 L34 10 Q42 4 41 14 L15 44 Z" fill="#e3eaf2" stroke="#1d2b4f" stroke-width="3" stroke-linejoin="round"/><rect x="3" y="36" width="14" height="8" rx="3" transform="rotate(-49 10 40)" fill="#ff3b5c" stroke="#1d2b4f" stroke-width="3"/></symbol>
    <symbol id="i-up" viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" fill="#2fd36b" stroke="#1d2b4f" stroke-width="3"/><path d="M24 34V15m-8 8l8-8 8 8" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-wheel" viewBox="0 0 48 48"><circle cx="24" cy="26" r="18" fill="#fff" stroke="#1d2b4f" stroke-width="3"/><path d="M24 26V8.5A17.5 17.5 0 0 1 39.2 17.3z" fill="#ff4d6d"/><path d="M24 26l15.2-8.7a17.5 17.5 0 0 1 0 17.4z" fill="#ffc928"/><path d="M24 26l15.2 8.7A17.5 17.5 0 0 1 24 43.5z" fill="#2fa8ff"/><path d="M24 26v17.5A17.5 17.5 0 0 1 8.8 34.7z" fill="#2fd36b"/><path d="M24 26L8.8 34.7a17.5 17.5 0 0 1 0-17.4z" fill="#a14dff"/><path d="M24 26L8.8 17.3A17.5 17.5 0 0 1 24 8.5z" fill="#ff8a3d"/><circle cx="24" cy="26" r="18" fill="none" stroke="#1d2b4f" stroke-width="3"/><circle cx="24" cy="26" r="4" fill="#fff" stroke="#1d2b4f" stroke-width="3"/><path d="M20 3h8l-4 7z" fill="#1d2b4f"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z" fill="currentColor"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5.5l11-2V16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.8" fill="currentColor"/><circle cx="17.5" cy="16" r="2.8" fill="currentColor"/></symbol>
    <symbol id="i-vibro" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M3 8v8M21 8v8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="currentColor"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="2.6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9.5c0 6-8 11-8 11z" fill="currentColor"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M9 11V4.5a1.5 1.5 0 0 1 3 0V10m0-1.5a1.5 1.5 0 0 1 3 0V11m0-1a1.5 1.5 0 0 1 3 0v1.5m0-.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8L4 16.5a1.6 1.6 0 0 1 2.4-2.1L9 16" fill="#fff" stroke="#1d2b4f" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-pointer" viewBox="0 0 40 48"><path d="M20 46L4 14a17 17 0 1 1 32 0z" fill="currentColor" stroke="#1d2b4f" stroke-width="3"/><circle cx="20" cy="16" r="6" fill="#fff"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3-1-6 1-9z" fill="currentColor"/></symbol>
    <symbol id="i-magnet" viewBox="0 0 24 24"><path d="M5 4h4v8a3 3 0 0 0 6 0V4h4v8a7 7 0 0 1-14 0z" fill="currentColor"/><path d="M5 4h4v3H5zM15 4h4v3h-4z" fill="#fff" opacity=".7"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2.5l8 3v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10v-6z" fill="currentColor"/><path d="M8.5 12l2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sharp" viewBox="0 0 24 24"><path d="M4 20L17 5q4-2 3 2L7 21z" fill="currentColor"/><path d="M15 3l2 2M19 7l2 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<canvas id="c" tabindex="0" aria-label="Game"></canvas>

<div id="ui">
  <div id="vignette"></div>
  <div id="floats"></div>

  <div id="topbar">
    <div class="pill" id="pillCoins"><svg class="i"><use href="#i-coin"/></svg><span id="coinsTotal">0</span></div>
    <div class="pill" id="pillStars" style="color:#ffd23f"><svg class="i" style="color:#ffd23f"><use href="#i-star"/></svg><span id="starsTotal" style="color:#fff">0</span></div>
    <div class="spacer"></div>
    <button class="round hidden" id="btnPause" aria-label="Pause"><svg class="i"><use href="#i-pause"/></svg></button>
    <button class="round" id="btnSettings" aria-label="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
  </div>

  <div id="hud" class="hidden">
    <div class="progress" id="progressWrap">
      <div class="lvlc" id="lvlA">1</div>
      <div class="bar" id="progBar"><i></i></div>
      <div class="lvlc next" id="lvlB">2</div>
    </div>
    <div id="bossbar" class="hidden"><span class="skull otext">👑</span><div class="bar"><i></i></div></div>
    <div id="lvlCoins" class="otext"><svg class="i"><use href="#i-coin"/></svg><span>0</span></div>
    <div id="fever"><i></i><span id="feverTxt">FEVER</span></div>
  </div>

  <div id="banner" class="otext"></div>
  <div id="hint"><svg class="hand"><use href="#i-hand"/></svg><span></span></div>

  <div id="menu" class="hidden">
    <div id="logo">
      <svg class="blade" viewBox="0 0 48 48"><use href="#i-blade"/></svg>
      <span class="l1">CHOP</span><span class="l2">HOP!</span>
    </div>
    <div id="lvlLabel" class="otext"></div>
    <div class="menu-side left">
      <button class="menu-btn" id="btnShop"><span class="ic"><svg><use href="#i-blade"/></svg></span><span data-t="shop"></span></button>
      <button class="menu-btn" id="btnUpgrades"><span class="ic"><svg><use href="#i-up"/></svg></span><span data-t="upgrades"></span></button>
    </div>
    <div class="menu-side right">
      <button class="menu-btn" id="btnWheel"><span class="ic"><svg><use href="#i-wheel"/></svg></span><span data-t="wheel"></span><span class="badge hidden" id="wheelBadge" data-t="free"></span></button>
    </div>
    <div id="tapPlay" class="otext" data-t="tapToPlay"></div>
    <div id="skinProg"><div class="mini"><img alt="" id="skinProgImg"></div><div><div data-t="newBlade" style="font-size:12px;opacity:.85"></div><div class="sbar"><i id="skinProgBar"></i></div></div><span id="skinProgPct">0%</span></div>
  </div>

  <!-- fail -->
  <div class="modal hidden" id="mFail">
    <div class="panel">
      <div class="ribbon" data-t="oops"></div>
      <div class="big-q" data-t="continue"></div>
      <div class="timer"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="50"/><circle class="fg" id="failTimer" cx="60" cy="60" r="50" stroke-dasharray="314" stroke-dashoffset="0"/></svg><div class="heart"><svg><use href="#i-heart"/></svg></div></div>
      <div class="btns">
        <button class="btn purple" id="btnRevive"><svg class="i"><use href="#i-ad"/></svg><span data-t="reviveAd"></span></button>
        <button class="link hidden" id="btnNoThanks" data-t="noThanks"></button>
      </div>
    </div>
  </div>

  <!-- complete -->
  <div class="modal hidden" id="mWin">
    <div class="panel">
      <div class="ribbon green" id="winTitle"></div>
      <div class="stars3" id="winStars"><span class="s"><svg><use href="#i-star"/></svg></span><span class="s"><svg><use href="#i-star"/></svg></span><span class="s"><svg><use href="#i-star"/></svg></span></div>
      <div class="rows">
        <div class="row"><span data-t="score"></span><b><span id="winScore">0</span><svg class="i"><use href="#i-coin"/></svg></b></div>
        <div class="row mult"><span data-t="bonus"></span><b id="winMult">x2</b></div>
        <div class="row result"><span data-t="result"></span><b><span id="winResult">0</span><svg class="i"><use href="#i-coin"/></svg></b></div>
      </div>
      <div class="best"><span data-t="best"></span>: <span id="winBest">0</span></div>
      <div class="newblade"><div class="mini"><img alt="" id="winSkinImg"></div><div class="txt"><span data-t="newBlade"></span><div class="sbar"><i id="winSkinBar"></i></div></div><span class="pct" id="winSkinPct">0%</span></div>
      <div class="btns">
        <button class="btn purple" id="btnClaim3"><svg class="i"><use href="#i-ad"/></svg><span data-t="claimX3"></span></button>
        <button class="btn green small hidden" id="btnClaim" data-t="claim"></button>
      </div>
    </div>
  </div>

  <!-- shop -->
  <div class="modal hidden" id="mShop">
    <div class="panel wide shop">
      <div class="ribbon blue" id="shopTitle" data-t="shop"></div>
      <button class="close" data-close aria-label="Close"><svg><use href="#i-close"/></svg></button>
      <div class="tabs"><button id="tabBlades" class="on" data-t="blades"></button><button id="tabUps" data-t="upgrades"></button></div>
      <div class="scroll" id="shopScroll"><div class="grid" id="shopGrid"></div><div id="upList" class="hidden"></div></div>
      <div class="shopfoot"><button class="btn purple small" id="btnFreeCoins"><svg class="i"><use href="#i-ad"/></svg><span id="freeCoinsTxt">+300</span><svg class="i"><use href="#i-coin"/></svg></button></div>
    </div>
  </div>

  <!-- wheel -->
  <div class="modal hidden" id="mWheel">
    <div class="panel">
      <div class="ribbon purple" data-t="wheel"></div>
      <button class="close" data-close aria-label="Close"><svg><use href="#i-close"/></svg></button>
      <div id="wheelWrap"><canvas id="wheelCanvas" width="600" height="600"></canvas><div id="wheelPtr"><svg><use href="#i-pointer"/></svg></div><div id="wheelHub"></div></div>
      <div id="wheelInfo"></div>
      <button class="btn green" id="btnSpin"><span data-t="spin"></span></button>
    </div>
  </div>

  <!-- settings -->
  <div class="modal hidden" id="mSettings">
    <div class="panel">
      <div class="ribbon blue" data-t="settings"></div>
      <button class="close" data-close aria-label="Close"><svg><use href="#i-close"/></svg></button>
      <div class="set-row"><span><svg class="i"><use href="#i-sound"/></svg> <span data-t="sound"></span></span><button class="toggle" id="tgSound" aria-label="Sound"></button></div>
      <div class="set-row"><span><svg class="i"><use href="#i-music"/></svg> <span data-t="music"></span></span><button class="toggle" id="tgMusic" aria-label="Music"></button></div>
      <div class="set-row" id="rowVibro"><span><svg class="i"><use href="#i-vibro"/></svg> <span data-t="vibro"></span></span><button class="toggle" id="tgVibro" aria-label="Vibration"></button></div>
      <div class="set-row"><span data-t="quality"></span><div class="seg" id="segQuality"><button data-v="auto" data-t="q_auto"></button><button data-v="high" data-t="q_high"></button><button data-v="low" data-t="q_low"></button></div></div>
      <div class="set-row"><span data-t="language"></span><div class="seg" id="segLang"></div></div>
      <button class="danger" id="btnReset" data-t="resetProgress"></button>
    </div>
  </div>

  <!-- pause -->
  <div class="modal hidden" id="mPause">
    <div class="panel">
      <div class="ribbon blue" data-t="paused"></div>
      <div class="btns" style="margin-top:8px">
        <button class="btn green" id="btnResume"><svg class="i"><use href="#i-play"/></svg><span data-t="resume"></span></button>
        <button class="btn blue" id="btnRestart"><svg class="i"><use href="#i-restart"/></svg><span data-t="restart"></span></button>
        <button class="btn yellow" id="btnHome"><svg class="i"><use href="#i-home"/></svg><span data-t="home"></span></button>
      </div>
      <div style="display:flex;gap:12px;margin-top:6px">
        <button class="round" id="qSound" aria-label="Sound"><svg class="i"><use href="#i-sound"/></svg></button>
        <button class="round" id="qMusic" aria-label="Music"><svg class="i"><use href="#i-music"/></svg></button>
      </div>
    </div>
  </div>

  <!-- unlock -->
  <div class="modal hidden" id="mUnlock">
    <div class="panel">
      <div class="ribbon purple" data-t="newBladeUnlocked"></div>
      <div class="rays"><img alt="" id="unlockImg"></div>
      <div class="uname" id="unlockName"></div>
      <div class="btns">
        <button class="btn green" id="btnEquipNew" data-t="equip"></button>
        <button class="link" data-close data-t="getIt"></button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<div id="adCover" class="hidden"><div><div class="spin"></div>AD</div></div>
<div id="loading"><div class="lt"><div class="spin"></div><span>Loading…</span></div></div>

<script src="game.js"></script>
</body>
</html>
