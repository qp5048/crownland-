<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b1d">
<title>StarClaim.io — Claim the planet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23101640'/%3E%3Cellipse cx='32' cy='38' rx='22' ry='8' fill='%233ee8ff'/%3E%3Cpath d='M18 37a14 14 0 0 1 28 0z' fill='%23b7f3ff' stroke='%23fff' stroke-width='2'/%3E%3Ccircle cx='14' cy='14' r='2' fill='%23ffd23f'/%3E%3Ccircle cx='50' cy='18' r='1.6' fill='%23fff'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#eef2ff;--muted:#97a3cf;--soft:#c4ccef;--cyan:#3ee8ff;--deep:#1fa9d6;--violet:#8b5cff;--pink:#ff4fd8;--gold:#ffc83d;--gold-deep:#d99500;--ember:#ff5a6e;--good:#3ddc97;--line:rgba(150,170,255,.16);--glass:rgba(22,28,66,.74);--glass2:rgba(255,255,255,.045);--st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px)}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:'Trebuchet MS','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:#070b1d}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;transition:transform .15s,background .15s,box-shadow .15s,border-color .15s,filter .15s;touch-action:manipulation}
@media(hover:hover){button:hover{transform:translateY(-2px)}}
button:active{transform:translateY(1px) scale(.98)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
input{-webkit-user-select:text;user-select:text;touch-action:manipulation}
#arena{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
.hidden{display:none!important}
li[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* ---------- header ---------- */
header{position:absolute;top:calc(18px + var(--st));left:calc(22px + var(--sl));right:calc(22px + var(--sr));display:flex;align-items:center;justify-content:space-between;z-index:6;pointer-events:none}
.header-left{display:flex;align-items:center;gap:12px;pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;font-family:'Arial Black','Segoe UI',sans-serif;font-weight:900;font-size:20px;letter-spacing:-.5px;color:var(--ink);text-decoration:none;pointer-events:auto;text-shadow:0 0 18px #3ee8ff55}
.brand svg{width:32px;height:32px;flex:none}
.brand em{font-style:normal;color:var(--cyan);font-size:.8em}
.tools{display:flex;gap:10px;pointer-events:auto}
.icon-btn{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:var(--glass);border:1px solid var(--line);color:#dfe6ff;box-shadow:0 8px 24px #0006,inset 0 1px 0 #ffffff12;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .off{display:none}.icon-btn.muted .on{display:none}.icon-btn.muted .off{display:inline}
@media(hover:hover){.icon-btn:hover{border-color:#3ee8ff66;color:var(--cyan)}}
.coin-chip{display:flex;align-items:center;gap:6px;height:36px;padding:0 13px 0 7px;border-radius:18px;background:linear-gradient(160deg,#3a2a08ee,#2a1d06ee);border:1px solid #ffc83d55;font-weight:800;font-size:15px;color:#ffd96a;box-shadow:0 6px 18px #0005;font-variant-numeric:tabular-nums}
.coin-chip .coin{width:22px;height:22px}.coin-chip.bump{animation:popIn .45s cubic-bezier(.3,1.7,.5,1)}
.coin{width:14px;height:14px;flex:none;vertical-align:-2px}

/* ---------- menu ---------- */
.overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none}
.menu-panel{pointer-events:auto;position:relative;width:430px;max-height:100%;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;padding:22px 28px 22px;background:linear-gradient(160deg,rgba(30,36,84,.86),rgba(12,16,42,.84));border:1px solid rgba(160,180,255,.2);border-radius:30px;box-shadow:0 30px 80px #0008,inset 0 1px 0 #ffffff14;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:center}
.menu-panel::-webkit-scrollbar{display:none}
.menu-panel:before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,#3ee8ff88,transparent 30%,transparent 70%,#ff4fd888);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.col{display:contents}
.logo{order:1}.tagline{order:2}.stage{order:3}.main-controls{order:4}.locker{order:5}
body.wide .menu-panel{width:850px;display:grid;grid-template-columns:1fr 330px;gap:22px;padding:24px;text-align:center}
body.wide .col{display:flex;flex-direction:column;min-width:0}
body.wide .col-main{justify-content:center;padding:4px 6px}
body.wide .col-hangar{padding:14px;border-radius:24px;background:var(--glass2);border:1px solid var(--line)}
.logo{margin:0;display:flex;flex-direction:column;align-items:center;gap:0;font-family:'Arial Black','Segoe UI',sans-serif;font-weight:900;font-size:50px;line-height:1;letter-spacing:-2px;color:var(--ink)}
.logo svg{width:86px;height:46px;margin-bottom:2px;filter:drop-shadow(0 0 14px #3ee8ff88)}
.logo .word{display:flex;align-items:baseline;background:linear-gradient(180deg,#ffffff 20%,#a9c4ff 60%,#7a8cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #2a2f7a) drop-shadow(0 0 22px #6b7dff66)}
.logo small{font-size:.42em;letter-spacing:-.5px;margin-left:3px;background:linear-gradient(180deg,#9ff6ff,#3ee8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{font-size:15px;font-weight:700;margin:8px 0 12px;color:var(--muted);letter-spacing:.3px}
.tagline b{color:var(--cyan)}
.stage{position:relative;display:flex;flex-direction:column;align-items:center}
.stage-title{display:none;align-self:stretch;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.stage-title span{color:var(--cyan);letter-spacing:.3px;text-transform:none;font-size:13px}
body.wide .stage-title{display:flex}
#preview{display:block;width:170px;height:128px;margin:0 auto 6px}
body.wide #preview{width:290px;height:210px;margin:4px auto 2px}
.pad{position:absolute;left:50%;bottom:10px;width:150px;height:30px;margin-left:-75px;border-radius:50%;background:radial-gradient(closest-side,#3ee8ff44,#3ee8ff10 70%,transparent);pointer-events:none}
body.wide .pad{width:230px;margin-left:-115px;bottom:12px;height:44px}
.field{width:100%;height:50px;background:rgba(5,8,26,.55);border:1.5px solid var(--line);border-radius:16px;padding:0 16px;color:var(--ink);font-size:17px;font-weight:700;outline:none;text-align:center;transition:border-color .2s,box-shadow .2s}
.field::placeholder{color:#6f7aa6}
.field:focus{border-color:var(--cyan);box-shadow:0 0 0 4px #3ee8ff1f}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mode-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:11px 12px 12px;text-align:left;background:var(--glass2);border:1.5px solid var(--line);border-radius:16px}
.mode-card b{display:flex;align-items:center;gap:7px;font-size:16px}
.mode-card b svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mode-card small{font-size:12px;line-height:1.35;color:var(--muted)}
.mode-card .sv-icon{display:inline-grid;place-items:center;width:20px;height:20px}
.mode-card[aria-checked="true"]{border-color:var(--cyan);background:linear-gradient(160deg,#3ee8ff22,#3ee8ff08);box-shadow:0 0 0 3px #3ee8ff1c,0 0 24px #3ee8ff22}
.mode-card[aria-checked="true"] b{color:#bff7ff}
.mode-card[data-mode="survival"][aria-checked="true"]{border-color:var(--ember);background:linear-gradient(160deg,#ff5a6e26,#ff5a6e08);box-shadow:0 0 0 3px #ff5a6e1f,0 0 24px #ff5a6e22}
.mode-card[data-mode="survival"] b{color:#ff8d9b}
.mode-card.locked{border-style:dashed;opacity:.8}
.mode-card.locked b{color:#8390bd}
.mode-note{margin:9px 0 0;font-size:12px;font-weight:700;color:#ff8d9b}
.mode-note:empty{display:none}
.primary{position:relative;display:block;width:100%;height:62px;margin-top:14px;border-radius:19px;background:linear-gradient(160deg,#5ff3ff,#2f8cff 70%,#5b5cff);color:#fff;font-weight:900;font-size:24px;letter-spacing:1px;text-transform:uppercase;text-shadow:0 2px 0 #1a3a9a;box-shadow:0 7px 0 #2140a8,0 14px 34px #2f8cff55,inset 0 2px 0 #ffffff66;overflow:hidden}
.primary:before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#ffffff55 48%,transparent 61%);transform:translateX(-120%);animation:shine 4.5s ease-in-out infinite}
.primary.danger{background:linear-gradient(160deg,#ff8a8a,#ff3f6c 60%,#d22a8a);text-shadow:0 2px 0 #8a1035;box-shadow:0 7px 0 #a01848,0 14px 34px #ff3f6c55,inset 0 2px 0 #ffffff55}
.primary.gold{background:linear-gradient(160deg,#ffe27a,#ffb21e);color:#4a2c00;text-shadow:none;box-shadow:0 7px 0 #b97d00,0 14px 30px #ffb21e44,inset 0 2px 0 #ffffff77}
.primary.violet{background:linear-gradient(160deg,#c49bff,#7b4dff 65%,#5a2fe0);text-shadow:0 2px 0 #3a1a9a;box-shadow:0 7px 0 #4425b0,0 14px 34px #7b4dff55,inset 0 2px 0 #ffffff55}
.primary .coin{width:20px;height:20px;vertical-align:-3px}
.primary[disabled],.primary[aria-disabled="true"]{filter:grayscale(.8);opacity:.55}
.play-row{display:flex;gap:10px;margin-top:14px}.play-row .primary{margin-top:0;flex:1}
.shop-btn{flex:none;width:74px;height:62px;border-radius:19px;background:linear-gradient(160deg,#c49bff,#6a3fd6);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;box-shadow:0 7px 0 #4b2aa3,0 14px 24px #6a3fd655,inset 0 2px 0 #ffffff55;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.shop-btn:active{transform:translateY(4px);box-shadow:0 3px 0 #4b2aa3}
.shop-btn canvas{width:40px;height:40px;margin-top:-6px}
.boost-chip{display:inline-flex;gap:6px;align-items:center;align-self:center;margin:12px auto 0;padding:6px 12px;border-radius:12px;background:#ffc83d1c;border:1px solid #ffc83d40;color:#ffd96a;font-size:12px;font-weight:700}
.boost-chip:empty{display:none}

/* Star Pass strip in the menu */
.pass-strip{position:relative;display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:10px 12px;border-radius:18px;text-align:left;background:linear-gradient(110deg,#2a1d5e,#1b2457 60%,#123a5a);border:1px solid #9d7bff55;box-shadow:inset 0 1px 0 #ffffff14,0 8px 24px #0005}
.pass-strip:after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(110deg,transparent 40%,#ffffff18 50%,transparent 60%);background-size:250% 100%;animation:sweep 5s linear infinite;pointer-events:none}
.ps-badge{flex:none;position:relative;display:grid;place-items:center;width:46px;height:50px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#ffe27a,#ff9f1c);color:#4a2c00;font-weight:900;font-size:18px}
.ps-badge small{position:absolute;top:7px;font-size:7px;letter-spacing:1px;font-weight:900}
.ps-badge b{margin-top:6px}
.ps-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ps-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ps-top b{font-size:15px;background:linear-gradient(90deg,#ffe27a,#ff9fe6);-webkit-background-clip:text;background-clip:text;color:transparent}
.ps-top em{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
.ps-bar{display:block;height:8px;border-radius:5px;background:#0006;overflow:hidden}
.ps-bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#ffc83d,#ff7ad9);box-shadow:0 0 10px #ff7ad9aa;transition:width .6s}
.ps-body small{font-size:11px;color:var(--soft)}
.ps-claim{flex:none;padding:7px 11px;border-radius:12px;background:linear-gradient(160deg,#5fffb4,#18c47a);color:#033a22;font-weight:900;font-size:12px;box-shadow:0 3px 0 #0e7a4a;animation:pulseGo 1.4s ease-in-out infinite}

.locker{display:flex;flex-direction:column;gap:10px}
.customize{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
body.wide .customize{grid-template-columns:repeat(3,1fr);margin-top:10px}
.customize button{position:relative;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;height:58px;border:1px solid var(--line);border-radius:15px;background:var(--glass2);font-weight:800;font-size:12px;color:var(--soft)}
.customize button svg{width:22px;height:22px;fill:none;stroke:var(--cyan);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(hover:hover){.customize button:hover{border-color:#3ee8ff66;background:#3ee8ff12}}
.customize .dot{position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:#ff4f8b;box-shadow:0 0 0 2px #141a40,0 0 8px #ff4f8b}
body.wide #missions-btn{display:none}
.ms-mini{display:none;text-align:left}
body.wide .ms-mini{display:block}
.ms-mini h4{display:flex;justify-content:space-between;margin:4px 2px 8px;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.ms-mini h4 span{letter-spacing:0;text-transform:none;color:var(--soft);font-weight:600}
.mission{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:13px;background:#ffffff08;border:1px solid var(--line);margin-bottom:6px}
.mission>div{flex:1;min-width:0}
.mission b{display:block;font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mission .mbar{display:block;height:5px;border-radius:3px;background:#0006;margin-top:5px;overflow:hidden}
.mission .mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),#8b5cff);border-radius:3px}
.mission em{flex:none;font-style:normal;font-size:11px;font-weight:900;color:#ffd96a;white-space:nowrap}
.mission.done{background:#3ddc9714;border-color:#3ddc9755}.mission.done em{color:var(--good)}.mission.done .mbar i{background:var(--good)}
.mission .mi{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:#3ee8ff18;color:var(--cyan);font-size:15px}
.mission.done .mi{background:#3ddc9722;color:var(--good)}

footer{position:absolute;bottom:calc(18px + var(--sb));left:calc(22px + var(--sl));right:calc(22px + var(--sr));display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:13px;color:#8d99c6;z-index:3}
.controls{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
footer button{font-size:13px;color:#8d99c6;display:flex;align-items:center;gap:6px}
footer button span{display:inline-grid;place-items:center;border:1px solid #6f7bab;border-radius:50%;width:18px;height:18px}

/* ---------- dialogs ---------- */
.modal{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#03051099;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:calc(16px + var(--st)) 16px calc(16px + var(--sb))}
.dialog{position:relative;width:min(480px,100%);max-height:100%;overflow:auto;padding:26px;background:linear-gradient(160deg,#1d2458,#10153a 70%);border:1px solid rgba(160,180,255,.22);border-radius:28px;box-shadow:0 30px 100px #000a,inset 0 1px 0 #ffffff14;animation:appear .22s ease;scrollbar-width:thin;scrollbar-color:#3a4590 transparent}
.dialog.wide{width:min(780px,100%)}
h2{font-size:26px;letter-spacing:-.4px;margin:0 30px 6px 0}
.close{position:absolute;right:16px;top:16px;border-radius:50%;width:34px;height:34px;font-size:24px;line-height:1;background:#ffffff12;color:var(--soft)}
.sub{font-size:14px;color:var(--muted);line-height:1.6;margin:0 0 18px}
.sub b{color:var(--ink)}
.skin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.dialog.wide .skin-grid{grid-template-columns:repeat(6,1fr)}
.skin-option{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:16px;padding:8px 2px 9px;background:#ffffff08;font-size:11px;font-weight:700;color:var(--soft)}
.skin-option canvas{width:58px;height:58px}
.skin-option.locked canvas{opacity:.5;filter:saturate(.6)}
.skin-option.locked{color:#7d88b4}
.lock{position:absolute;top:6px;right:6px;width:16px;height:16px;fill:none;stroke:#8f9ac6;stroke-width:2.2;stroke-linecap:round}
.skin-option[aria-pressed="true"],.trail-option[aria-pressed="true"]{border-color:var(--cyan)!important;background:#3ee8ff16;box-shadow:0 0 0 3px #3ee8ff1a}
.trail-option{position:relative;display:flex;align-items:center;gap:15px;text-align:left;width:100%;background:#ffffff08;border:1.5px solid var(--line);border-radius:15px;padding:14px;margin-top:10px}
.trail-option.locked .trail-swatch{opacity:.3}
.trail-swatch{flex:none;display:block;width:84px;height:10px;border-radius:8px;background:var(--cyan);box-shadow:inset 0 2px #ffffff60}
.trail-swatch.dashes{background:repeating-linear-gradient(90deg,var(--cyan) 0 11px,transparent 11px 16px);box-shadow:none}
.trail-swatch.sparkles{box-shadow:0 0 12px var(--cyan)}
.trail-swatch.rainbow{background:linear-gradient(90deg,#fa83ae,#ffcd68,#59dba7,#59cafa,#b098ff)}
.trail-option strong{font-size:14px}.trail-option small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.req{margin:14px 0 0;font-size:13px;color:#ff8d9b;text-align:center;font-weight:600}
.req:empty{display:none}
.done{height:52px;font-size:18px;margin-top:20px}
.secondary{width:100%;padding:13px;margin-top:12px;border-radius:14px;background:#ffffff10;border:1px solid var(--line);font-weight:800;color:var(--soft)}
.help-row{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
.help-row svg{flex:none;width:30px;height:30px;fill:none;stroke:var(--cyan);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.help-row strong{display:block}.help-row span{color:var(--muted)}
.help-row.hot svg{stroke:var(--ember)}.help-row.gold svg{stroke:var(--gold)}
.result-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:16px 0}
.result-stats div{background:#ffffff0a;border:1px solid var(--line);text-align:center;padding:13px 4px;border-radius:14px}
.result-stats b{display:block;font-size:21px}
.result-stats span{font-size:11px;color:var(--muted)}
.shake{animation:shake .4s}

/* ranks */
.rank-block{display:flex;align-items:center;gap:16px;padding:14px;border-radius:20px;background:#ffffff0a;border:1px solid var(--line)}
.medal-stage{position:relative;flex:none;width:124px;height:124px;display:grid;place-items:center}
.medal-stage canvas{position:relative;z-index:1}
.medal-stage:before{content:'';position:absolute;inset:4px;border-radius:50%;background:conic-gradient(#fff0 0 8%,#ffe08a 14%,#fff0 22% 45%,#9fe8ff 52%,#fff0 60% 80%,#ffc2e0 86%,#fff0 94%);opacity:0;filter:blur(2px)}
.rank-block.up .medal-stage:before{opacity:1;animation:spin 3.5s linear infinite}
.rank-block.up .medal-stage canvas{animation:medalPop 1s cubic-bezier(.3,1.6,.5,1) .25s both}
.rank-block.down .medal-stage canvas{animation:medalDrop .7s ease both}
.rank-info{flex:1;min-width:0}
.rank-info small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.rank-block.up .rank-info small{color:var(--good)}
.rank-block.down .rank-info small{color:var(--ember)}
.rank-info b{display:block;font-size:22px;letter-spacing:-.3px;margin:2px 0}
.rp-delta{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.rp-delta.pos{color:var(--good)}.rp-delta.neg{color:var(--ember)}
.rank-bar{height:8px;border-radius:5px;background:#0006;overflow:hidden;margin-top:12px}
.rank-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffc93c,#ff8f3c);border-radius:5px;transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.rank-bar-labels{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-top:5px}
.rp-lines{list-style:none;padding:0;margin:10px 0 0;font-size:13px}
.rp-lines li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);color:var(--soft)}
.rp-lines b.pos{color:var(--good)}.rp-lines b.neg{color:var(--ember)}
.rewards{margin-top:14px;padding:12px 14px;border-radius:16px;background:#ffc83d14;border:1px solid #ffc83d33}
.rewards h4{margin:0 0 6px;font-size:14px;color:#ffd96a}
.reward{display:flex;align-items:center;gap:12px;padding:5px 0;animation:rise .5s ease both}
.reward b{display:block;font-size:14px}.reward span{font-size:12px;color:var(--muted)}
.banner{margin-top:12px;padding:12px 14px;border-radius:14px;background:#ff5a6e1c;border:1px solid #ff5a6e44;color:#ff9aa6;font-weight:700;font-size:14px}
.profile-head{display:flex;gap:16px;align-items:center;padding:14px;border-radius:20px;background:#ffffff0a;border:1px solid var(--line)}
.profile-head>div{flex:1;min-width:0}.profile-head>#pf-medal{flex:none}
.profile-head b{font-size:22px;display:block}
.profile-head span{font-size:13px;color:var(--muted)}
.section-title{font-size:15px;margin:20px 0 8px}
.ach-list{display:flex;flex-direction:column;gap:6px}
.ach{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;background:#ffffff08;border:1px solid var(--line)}
.ach>div{flex:1;min-width:0}.ach b{font-size:13px;display:block}.ach span{font-size:12px;color:var(--muted)}
.ach em{font-style:normal;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ach.done{background:#3ddc9712;border-color:#3ddc9744}.ach.done em{color:var(--good)}
.ach:not(.done) canvas,.ach:not(.done) .thumb-trail{opacity:.45}
.thumb-trail{display:grid;place-items:center;flex:none}
.history{list-style:none;margin:0;padding:0;font-size:12px}
.history li{display:grid;grid-template-columns:76px 1fr auto auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);color:var(--soft)}
.history .pos{color:var(--good);font-weight:700}.history .neg{color:var(--ember);font-weight:700}
.rank-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rank-cell{position:relative;display:flex;flex-direction:column;align-items:center;padding:6px 2px 8px;border-radius:14px;font-size:10px;color:var(--muted);text-align:center}
.rank-cell b{font-size:11px;color:var(--ink)}
.rank-cell.current{background:#ffc83d18;box-shadow:inset 0 0 0 2px #ffc93c}
.rank-cell.locked b{color:#7d88b4}
.rank-cell.locked canvas{opacity:.55;filter:saturate(.75)}.rank-cell .lock{top:4px;right:6px}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;z-index:3;pointer-events:none}
.score{position:absolute;top:calc(84px + var(--st));left:calc(22px + var(--sl));width:210px;padding:15px 18px;border-radius:22px;background:var(--glass);border:1px solid var(--line);box-shadow:0 10px 30px #0006,inset 0 1px 0 #ffffff12;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.score-top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.badge{font-style:normal;font-size:10px;font-weight:800;padding:3px 8px;border-radius:9px;background:#3ee8ff22;color:var(--cyan);white-space:nowrap}
.badge.hot{background:#ff5a6e22;color:#ff8d9b}
.score strong{display:block;font-size:40px;font-weight:900;letter-spacing:-1.5px;margin-top:2px;text-shadow:0 0 20px #3ee8ff44}
.score strong small{font-size:20px;color:var(--muted);margin-left:2px}
.score-track{height:6px;border-radius:4px;background:#0007;overflow:hidden;margin:8px 0}
.score-track i{display:block;height:100%;width:0;min-width:3px;background:linear-gradient(90deg,var(--cyan),#8b5cff);box-shadow:0 0 8px var(--cyan);transition:width .3s}
.score-details{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.leaderboard{position:absolute;right:calc(22px + var(--sr));top:calc(84px + var(--st));width:216px;padding:14px 16px;border-radius:22px;background:var(--glass);border:1px solid var(--line);box-shadow:0 10px 30px #0006,inset 0 1px 0 #ffffff12;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.leaderboard h3{margin:0 0 8px;font-size:12px;color:var(--muted);letter-spacing:.4px}
.leaderboard ol{list-style:none;padding:0;margin:0}
.leaderboard li{display:flex;align-items:center;gap:7px;font-size:12px;padding:6px 0;color:var(--soft)}
.leaderboard li.me{color:var(--cyan);font-weight:800;background:#3ee8ff14;border-radius:8px;margin:0 -7px;padding:6px 7px}
.leaderboard .rank{width:14px;font-size:11px;color:#7d88b4;text-align:center}
.leaderboard li:first-child .rank{color:var(--gold);font-size:13px}
.leaderboard .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 6px currentColor}
.leaderboard .name{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.leaderboard .lives{font-size:8px;letter-spacing:1px;color:#ff6d86}
.leaderboard .pct{font-size:11px;font-variant-numeric:tabular-nums}
#hud.tutorial .score,#hud.tutorial .leaderboard{display:none}
.game-hint{position:absolute;bottom:calc(26px + var(--sb));left:50%;transform:translateX(-50%);padding:9px 16px;border-radius:18px;background:var(--glass);border:1px solid var(--line);color:var(--soft);font-size:12px;white-space:nowrap;transition:opacity .6s}
.game-hint.fade{opacity:0}
#toast{position:fixed;z-index:11;pointer-events:none;left:50%;top:24%;transform:translate(-50%,10px);padding:10px 22px;border-radius:19px;background:rgba(16,22,58,.9);border:1px solid #3ee8ff55;box-shadow:0 10px 30px #0008,0 0 24px #3ee8ff22;font-size:19px;font-weight:800;color:var(--cyan);opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-6px)}
#toast.gold{color:#ffd96a;border-color:#ffc83d66;box-shadow:0 10px 30px #0008,0 0 24px #ffc83d33}
#toast.alert{color:#ff8d9b;border-color:#ff5a6e66}

/* tutorial coach */
.coach{position:absolute;top:calc(80px + var(--st));left:50%;width:min(460px,calc(100vw - 24px));margin-left:calc(min(460px,calc(100vw - 24px)) / -2);display:flex;gap:14px;align-items:center;padding:14px;border-radius:22px;background:rgba(20,26,66,.92);border:1px solid #3ee8ff44;box-shadow:0 16px 44px #0008;pointer-events:auto;z-index:4}
.coach.pop{animation:coachIn .5s cubic-bezier(.2,1.4,.4,1) both}
.coach-icon{flex:none;width:58px;height:58px;border-radius:17px;background:#3ee8ff18;display:grid;place-items:center;transition:background .3s}
.coach-icon svg{width:42px;height:42px;fill:none;stroke:var(--cyan);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.coach.complete .coach-icon{background:#3ddc9722}
.coach.complete .coach-icon svg{stroke:var(--good);animation:popIn .45s cubic-bezier(.3,1.7,.5,1) both}
.coach-body{flex:1;min-width:0}
.coach-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);font-weight:700}
.coach-dots{display:flex;gap:4px}.coach-dots i{width:7px;height:7px;border-radius:50%;background:#3a4478;transition:background .3s}
.coach-dots i.on{background:var(--cyan)}.coach-dots i.ok{background:var(--good)}
.coach h4{margin:3px 0 2px;font-size:17px}
.coach p{margin:0;font-size:13px;line-height:1.45;color:var(--soft)}
.coach-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;align-self:stretch;justify-content:space-between}
.coach-skip{font-size:12px;color:var(--muted);padding:4px 6px;border-radius:8px}
.coach-go{padding:10px 14px;border-radius:12px;background:linear-gradient(160deg,#5ff3ff,#2f8cff);color:#fff;font-weight:800;font-size:14px;box-shadow:0 4px 0 #2140a8;white-space:nowrap}
.ic-move{animation:icMove 1.6s ease-in-out infinite}
.ic-drag{animation:icDrag 1.8s ease-in-out infinite}
.ic-draw{stroke-dasharray:60;animation:icDraw 1.8s ease-in-out infinite}
.ic-bob{animation:icBob 1.2s ease-in-out infinite}

.joystick{position:fixed;left:0;top:0;width:118px;height:118px;margin:-59px 0 0 -59px;border-radius:50%;background:radial-gradient(circle,#3ee8ff14 0 54%,#3ee8ff33 55% 100%);border:2px solid #3ee8ffaa;box-shadow:0 0 26px #3ee8ff44,inset 0 0 0 1px #ffffff12;z-index:4;pointer-events:none;will-change:transform}
.joy-knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#a8f4ff 45%,#2f8cff);border:2px solid #fff;box-shadow:0 0 18px #3ee8ff;will-change:transform}

.boost-btn{position:absolute;left:50%;bottom:calc(76px + var(--sb));transform:translateX(-50%);pointer-events:auto;display:flex;align-items:center;gap:10px;padding:9px 16px 9px 9px;border-radius:20px;background:linear-gradient(160deg,#ffe07a,#ffbf2e);color:#4a2c00;box-shadow:0 5px 0 #b97d00,0 10px 24px #ffbf2e44;text-align:left}
.boost-btn b{display:block;font-size:14px}.boost-btn small{font-size:11px;opacity:.8}
.boost-btn.running{background:linear-gradient(160deg,#fff4c9,#ffe07a);box-shadow:0 3px 0 #b97d00}
.boost-ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#b97d00 calc(var(--p,1)*360deg),#fff6d6 0);font-size:18px}
.boost-ic span{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff8e1}
.fx{position:fixed;inset:0;width:100%;height:100%;z-index:12;pointer-events:none}

/* settings, shop */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;text-align:left}
.set-row>div{min-width:0}.set-row b{display:block}.set-row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.seg{display:flex;flex:none;background:#0005;border-radius:12px;padding:3px;gap:3px}
.seg button{padding:7px 11px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:linear-gradient(160deg,#3ee8ff,#2f8cff);color:#fff;box-shadow:0 2px 10px #2f8cff66}
.set-card{margin-top:12px;padding:4px 14px 2px;border-radius:18px;background:#ffffff08;border:1px solid var(--line)}
.set-card .set-row:last-child{border-bottom:0}
.set-sec{display:flex;align-items:center;gap:8px;margin:10px 0 2px;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--cyan)}
.set-sec svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.set-row.vol{padding:8px 0 12px}.set-row.vol.off{opacity:.45}
.slider{display:flex;align-items:center;gap:10px;flex:1;max-width:240px}
.slider output{min-width:40px;text-align:right;font-weight:800;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.slider input{flex:1;-webkit-appearance:none;appearance:none;height:8px;border-radius:5px;background:linear-gradient(90deg,var(--cyan) 0 var(--v,50%),#0007 var(--v,50%));outline:none;touch-action:pan-y}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#a8f4ff 50%,#2f8cff);border:2px solid #fff;box-shadow:0 0 10px #3ee8ff;cursor:pointer}
.slider input::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#a8f4ff;border:2px solid #fff;box-shadow:0 0 10px #3ee8ff;cursor:pointer}
.set-foot{display:flex;gap:10px}.set-foot .secondary{flex:1}
.set-sub{padding-left:14px;border-left:3px solid var(--line);margin-left:2px}
.shop-head{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:20px;background:linear-gradient(135deg,#3a1f7a88,#12407088);border:1px solid #9d7bff44;text-align:left}
.shop-head canvas{flex:none}.shop-head p{margin:0;font-size:14px;color:#e4dcff;font-weight:600;line-height:1.45}
.shop-head .wallet{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-weight:800;color:#ffd96a}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0 12px;scrollbar-width:none;touch-action:pan-x}
.tabs button{padding:8px 13px;border-radius:12px;background:#ffffff0d;border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap;flex:none;color:var(--soft)}
.tabs button[aria-selected="true"]{background:linear-gradient(160deg,#3ee8ff,#2f8cff);border-color:transparent;color:#fff}
.price{display:inline-flex;align-items:center;gap:3px;margin-top:2px;font-size:11px;font-weight:800;color:#ffd96a;background:#ffc83d1f;padding:2px 7px;border-radius:9px}
.skin-option.r-rare{border-color:#4d8dff66}.skin-option.r-epic{border-color:#a26bff77}.skin-option.r-legendary{border-color:#ffc83d88;background:linear-gradient(#ffc83d14,#ffffff06)}.skin-option.r-pass{border-color:#ff7ad966;background:linear-gradient(#ff7ad912,#ffffff05)}
.rar{font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#8390bd}
.r-rare .rar,.rar.rare{color:#6ea6ff}.r-epic .rar,.rar.epic{color:#c39bff}.r-legendary .rar,.rar.legendary{color:#ffc83d}.r-pass .rar,.rar.pass{color:#ff8fe0}
.buy-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:10px 12px;border-radius:14px;background:#ffffff0d;border:1px solid var(--line);font-size:13px;font-weight:600;text-align:left}
.buy-bar:empty{display:none}
.buy{padding:9px 14px;border-radius:12px;background:linear-gradient(160deg,#ffe07a,#ffbf2e);color:#4a2c00;font-weight:800;box-shadow:0 3px 0 #b97d00;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;flex:none}
.buy[aria-disabled="true"]{filter:grayscale(.7);opacity:.6}
.boost-card{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;border-radius:16px;background:#ffffff08;border:1.5px solid var(--line);text-align:left}
.boost-card.ready{border-color:#ffc93c;background:#ffc83d12}
.boost-card .big{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#ffc83d1c}
.boost-card .big svg{width:28px;height:28px}
.boost-card>div{flex:1;min-width:0}.boost-card b{display:block;font-size:14px}.boost-card small{color:var(--muted);font-size:12px}
.box-stage{display:grid;place-items:center;height:170px;margin:4px 0 8px;border-radius:18px;background:radial-gradient(circle,#5a2fe055,#0c1030 72%)}
.box-stage.shake canvas{animation:shake .5s 2}
.box-stage canvas{width:150px;height:150px}
.daily{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 4px}
.daily div{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:13px;background:#ffffff0a;border:1px solid var(--line);font-size:11px;color:var(--muted);font-weight:700}
.daily div b{font-size:13px;color:#ffd96a}.daily div.got{background:#3ddc9718;color:var(--good)}.daily div.today{background:#ffc83d1c;box-shadow:inset 0 0 0 2px #ffc93c;color:#ffd96a}
.revive-ring{display:grid;place-items:center;width:110px;height:110px;margin:6px auto 12px;border-radius:50%;background:conic-gradient(#ffc93c calc(var(--p,1)*360deg),#ffffff12 0)}
.revive-ring span{display:grid;place-items:center;width:92px;height:92px;border-radius:50%;background:#141a44;font-size:34px;font-weight:900}
.coins-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:10px 14px;border-radius:14px;background:#ffc83d14;border:1px solid #ffc83d33;font-weight:800;color:#ffd96a;font-size:14px}
.coins-line small{font-weight:600;color:#c9a95a}
.coins-line.bad{background:#ff5a6e18;border-color:#ff5a6e44;color:#ff8d9b}
.trail-swatch.t-neon{background:#aef6ff;box-shadow:0 0 10px #00e5ff,inset 0 0 0 2px #00e5ff}
.trail-swatch.t-pixel{background:repeating-linear-gradient(90deg,var(--cyan) 0 9px,transparent 9px 14px);border-radius:0;box-shadow:none}
.trail-swatch.t-candy{background:repeating-linear-gradient(90deg,#e8334a 0 9px,#fff 9px 18px)}
.trail-swatch.t-ice{background:linear-gradient(#9fe3ff,#fff 45%,#9fe3ff)}
.trail-swatch.t-hearts{background:#ff8fb8;height:6px;margin:2px 0}
.trail-swatch.t-fire{background:linear-gradient(90deg,#ff5a1f,#ffb02e,#ff6a1f,#ffd23f)}
.trail-swatch.t-galaxy{background:radial-gradient(circle,#fff 0 1px,transparent 1.5px) 0 0/8px 8px,#3b1e7a}
.trail-swatch.t-gold{background:linear-gradient(#fff3b0,#e8a800 60%,#b97d00)}
.trail-swatch.t-comet{background:linear-gradient(90deg,transparent,#4fc3ff66 30%,#bff0ff);height:12px;clip-path:polygon(0 45%,100% 0,100% 100%,0 55%);box-shadow:none}
.trail-swatch.t-warp{background:repeating-linear-gradient(90deg,#fff 0 6px,#8b5cff 6px 16px);box-shadow:0 0 10px #8b5cff}
.trail-swatch.t-plasma{background:linear-gradient(90deg,#ff4fd8,#8b5cff,#3ee8ff,#ff4fd8);box-shadow:0 0 12px #ff4fd8}
.trail-option .price{margin-left:auto}
.skin-option.buyable{color:var(--ink)}.trail-option.buyable .trail-swatch{opacity:1}
.icon-btn.audio-locked{animation:pulseRing 1.6s ease-in-out infinite}

.chest-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chest-card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 10px 12px;border-radius:18px;background:radial-gradient(circle at 50% 30%,#7b4dff33,#ffffff06 70%);border:1.5px solid #9d7bff55;text-align:center}
.chest-card.nova{background:radial-gradient(circle at 50% 30%,#ff9a3c33,#ffffff06 70%);border-color:#ffc83d66}
.chest-card b{font-size:16px}.chest-card small{font-size:12px;color:var(--muted);line-height:1.4;min-height:50px}
.chest-card .odds{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 8px;margin:2px 0 6px}
.chest-stage{height:200px;transition:background .4s}
.chest-stage.revealed{animation:popIn .45s cubic-bezier(.3,1.7,.5,1)}
.chest-stage.r-epic{background:radial-gradient(circle,#a26bff55,#0c1030 72%)}.chest-stage.r-legendary{background:radial-gradient(circle,#ffc83d55,#0c1030 72%)}.chest-stage.r-mythic{background:radial-gradient(circle,#ff4f8b66,#0c1030 72%)}.chest-stage.r-rare{background:radial-gradient(circle,#4d8dff55,#0c1030 72%)}
.chest-result{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.chest-result b{font-size:22px}.chest-result small{color:var(--muted)}.chest-result .rar{font-size:12px}
.chest-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px;width:100%}.chest-actions .secondary{margin-top:2px}
.skin-option.r-mythic{border-color:#ff4f8b99;background:linear-gradient(160deg,#ff4f8b1c,#8b5cff14)}
.r-mythic .rar,.rar.mythic{color:#ff7ab8}
#chest-only .skin-option.locked canvas{opacity:.9;filter:none}#chest-only .skin-option.locked{color:var(--soft)}
/* ---------- Star Pass ---------- */
.bp-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:14px 16px;border-radius:20px;background:linear-gradient(110deg,#3a1f7a,#1b2a6b 55%,#0f4a6a);border:1px solid #9d7bff55;position:relative;overflow:hidden}
.bp-head:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,#ff7ad933,transparent 45%),radial-gradient(circle at 10% 90%,#3ee8ff2a,transparent 45%);pointer-events:none}
.bp-season small{display:block;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#c9b8ff;font-weight:800}
.bp-season b{display:block;font-size:24px;letter-spacing:-.3px;margin:2px 0;background:linear-gradient(90deg,#fff,#ffd6f5);-webkit-background-clip:text;background-clip:text;color:transparent}
.bp-season span{font-size:12px;color:var(--soft)}
.bp-level{display:flex;align-items:center;gap:12px;min-width:220px}
.bp-badge{flex:none;display:grid;place-items:center;width:58px;height:64px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#ffe27a,#ff9f1c);color:#4a2c00;font-weight:900;font-size:24px;line-height:1}
.bp-badge small{display:block;font-size:8px;letter-spacing:1px;text-align:center}
.bp-xp{flex:1;min-width:0}
.bp-xp .ps-bar{height:10px}

/* =====================================================================
   ENGINE — continuous 100×100 world, hidden 240×240 ownership mask,
   fixed 120 Hz simulation with render interpolation.

(function(global){

const N=240,S=N/100,TAU=Math.PI*2,STEP=1/120,MAX_STEPS=12,BOTS=9,LIVES=3;

  case 14:if(!lite){c.lineWidth=1.5+.3*Math.sin(time*8);c.strokeStyle='rgba(255,79,216,.22)';c.stroke(path)}c.lineWidth=.75;chunks(3,(k,p)=>`hsl(${(280+Math.sin(p.d*.6-time*6)*60+360)%360},95%,${62+Math.sin(p.d-time*9)*10}%)`);break;

});
const endTouch=e=>{if(e.pointerId===joy.id)releaseJoystick()};
canvas.addEventListener('pointerup',endTouch);canvas.addEventListener('pointercancel',endTouch);canvas.addEventListener('lostpointercapture',endTouch);

/* ---------- lifecycle ---------- */
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){if(game&&game.mode==='playing')pause();if(Sound.ctx&&Sound.ctx.state==='running')Sound.ctx.suspend().catch(()=>{})}
 else{last=0;if(Sound.ctx&&Sound.ctx.state==='suspended')Sound.ctx.resume().then(audioLockUI).catch(()=>{})}
});
addEventListener('pagehide',save);

/* ---------- loop: clamped delta, fixed-step sim, adaptive resolution, eco frame cap ---------- */
let hudClock=0,perfAvg=1/60,perfClock=0,lockClock=0;
const SHOWCASE=[{skin:itemFor('skin','jupiter'),acc:'satellite'},{skin:itemFor('skin','kitty'),acc:'bow'},{skin:itemFor('skin','astro'),acc:'beam'},{skin:itemFor('skin','galaxy'),acc:'ring'}];
function update(dt){
 time+=dt;if(!game)menuIntro+=dt;aimMouse();Tutorial.update(dt);if(game)game.update(dt);
 if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('#toast').classList.remove('show')}
 if(hintTimer>0){hintTimer-=dt;if(hintTimer<=0)$('#game-hint').classList.add('fade')}
}
const HEAD_ACCS=new Set(['party','halo','horns','tophat','wizard','viking','cowboy','catears','antenna','headphones','bow']);
function drawPreview(){
 const w=preview.clientWidth,h=preview.clientHeight;if(!w||!h)return;const k=preview.width/w,eco=prefs.set.eco;
 pctx.setTransform(1,0,0,1,0,0);pctx.clearRect(0,0,preview.width,preview.height);pctx.setTransform(k,0,0,k,0,0);
 const skin=currentSkin(),acc=currentAcc(),tall=acc==='wizard'||acc==='antenna',head=skin.crown||HEAD_ACCS.has(acc),s=Math.min(w,h)*(tall?.38:head?.44:.52),wob=renderer.reduce||eco?0:Math.sin(time*1.4)*.35;
 renderer.drawCube(pctx,skin,w/2,h*(tall?.7:head?.64:.53),s,-Math.PI/2+wob,0,eco?0:time,0,skin.crown,k,2.2,acc);
}
let shopIconDrawn=false;
function drawShopIcon(){
 if(prefs.set.eco&&shopIconDrawn)return;shopIconDrawn=true;const k=shopIcon.width/38;
 sictx.setTransform(1,0,0,1,0,0);sictx.clearRect(0,0,shopIcon.width,shopIcon.height);sictx.setTransform(k,0,0,k,0,0);
 const t=prefs.set.eco?0:time;renderer.drawCube(sictx,MAGIC_DEF,19,23,17,-Math.PI/2+Math.sin(t*2)*.25,0,t,0,null,k,1.6,null);
}
function draw(dt){
 if(game){renderer.draw(game,W,H,dt,currentSkin(),currentAcc(),trailKind(),time);view=renderer.view}
 else{renderer.menu(W,H,time,menuIntro,SHOWCASE);if(!$('#menu').classList.contains('hidden')){drawPreview();drawShopIcon()}}
}
function adapt(dt){if(!game||game.mode!=='playing'||manual||prefs.set.eco)return;perfAvg+=(dt-perfAvg)*.05;perfClock+=dt;if(perfClock<3)return;perfClock=0;if(perfAvg>1/42&&dprCap>1){dprCap=Math.max(1,dprCap-.5);resize()}}
function frame(t){
 requestAnimationFrame(frame);
 // Ultra economy: draw at most 60, 40 or 30 frames per second.
 if(prefs.set.eco&&last&&t-last<1000/prefs.set.fps-1.5)return;
 let dt=last?(t-last)/1000:1/60;last=t;if(!(dt>0))dt=1/60;if(dt>.1)dt=.1;
 if(!manual)update(dt);draw(dt);hudClock+=dt;if(hudClock>.2){updateHud();hudClock=0}adapt(dt);
 lockClock+=dt;if(lockClock>1){lockClock=0;audioLockUI()}
}

/* ---------- test hooks ---------- */
window.render_game_to_text=()=>JSON.stringify(game?{...game.state(),skin:currentSkin().name,trail:prefs.trail,acc:prefs.acc,coins:prefs.coins,boost:game.boost,revives:game.revives,pending:game.pending.length,tutorialStep:Tutorial.active?Tutorial.STEPS[Tutorial.step].id:null}:{mode:'menu',gameMode:prefs.mode,rp:prefs.rp,rank:RANKS[rankIndex(prefs.rp)].name,classicGames:prefs.classicGames,coins:prefs.coins,skin:currentSkin().name});
window.advanceTime=ms=>{manual=true;for(let n=0;n<Math.ceil(ms/(1000/60));n++)update(1/60);draw(1/60);updateHud()};

/* ---------- boot ---------- */
$('#controls-label').textContent=coarse?'Touch and drag to steer':'Mouse, WASD or arrow keys · Space: boost';
applyEco();applyView();refreshMenu();Sound.unlock();Music.play('menu');playIntro();Poki.load();audioLockUI();requestAnimationFrame(frame);
function maybeDaily(){if(prefs.tutorialDone&&dailyState()&&!popups.includes(showDaily))queuePopup(showDaily)}
if(penaltyNotice)popups.push(()=>showModal('Ranked match abandoned',`<p class="sub">You closed the game during a ranked Survival match, so it counted as leaving.</p><div class="coins-line" style="background:#fff1ef;color:#d2382e"><span>Leaving penalty</span><span>−${QUIT_PENALTY} RP</span></div><p class="sub" style="margin-top:14px">You are now ${RANKS[rankIndex(prefs.rp)].name} with ${prefs.rp} RP. Finish ranked matches to avoid this.</p><button class="primary done" id="ok-pen">Got it</button>`,false)||$('#ok-pen').addEventListener('click',()=>{Sound.play('click');hideModal()}));
setTimeout(()=>{maybeDaily();nextPopup()},1600);
{const h=home;home=function(){h();maybeDaily()}}
</script>
</body>
</html>
